<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Orders - Next Level Subs</title>

    <link
        rel="stylesheet"
        href="./src/output.css"
    >

    <link
        rel="stylesheet"
        href="./src/all.min.css"
    >

    <style>

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --purple: #7c3aed;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(37, 99, 235, 0.08),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           HEADER
        ====================================================== */

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.9);
        }

        .header-inner {
            width: min(1500px, calc(100% - 32px));
            min-height: 72px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: 12px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 999px;
            background: #eff6ff;
            color: var(--primary-color);
            font-size: 13px;
            font-weight: 700;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 11px;
            background: #fff;
            border: 1px solid var(--border);
            color: #374151;
            text-decoration: none;
            font-weight: 700;
            transition: .25s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
        }

        /* =====================================================
           MAIN
        ====================================================== */

        .container-main {
            width: min(1500px, calc(100% - 32px));
            margin: auto;
            padding: 30px 0 60px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-heading h1 {
            margin: 0;
            font-size: clamp(27px, 4vw, 40px);
            font-weight: 850;
            letter-spacing: -.035em;
        }

        .page-heading p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .refresh-btn {
            border: 1px solid var(--border);
            background: #fff;
            color: #374151;
            border-radius: 12px;
            padding: 11px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            transition: .25s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            color: var(--primary-color);
            box-shadow: 0 10px 25px rgba(15, 23, 42, .08);
        }

        .refresh-btn.loading i {
            animation: spin .8s linear infinite;
        }

        /* =====================================================
           STATS
        ====================================================== */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 7px 25px rgba(15, 23, 42, .045);
            transition: .25s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(15, 23, 42, .08);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .stat-icon.blue {
            background: #eff6ff;
            color: #2563eb;
        }

        .stat-icon.orange {
            background: #fff7ed;
            color: #ea580c;
        }

        .stat-icon.green {
            background: #f0fdf4;
            color: #16a34a;
        }

        .stat-icon.purple {
            background: #faf5ff;
            color: #7c3aed;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
        }

        .stat-value {
            margin-top: 3px;
            font-size: 24px;
            font-weight: 850;
        }

        /* =====================================================
           FILTER BAR
        ====================================================== */

        .filter-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 7px 25px rgba(15, 23, 42, .045);
        }

        .filters {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 180px 180px auto;
            gap: 12px;
        }

        .input {
            width: 100%;
            min-height: 44px;
            padding: 10px 13px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: #fff;
            color: var(--text);
            transition: .2s ease;
        }

        .input:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, .1);
        }

        .clear-btn {
            border: 0;
            border-radius: 11px;
            padding: 10px 16px;
            background: #f3f4f6;
            color: #374151;
            font-weight: 700;
        }

        .clear-btn:hover {
            background: #e5e7eb;
        }

        /* =====================================================
           ORDERS
        ====================================================== */

        .orders-grid {
            display: grid;
            gap: 16px;
        }

        .order-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(15, 23, 42, .05);
            animation: cardIn .45s ease both;
            transition: .25s ease;
        }

        .order-card:hover {
            box-shadow: 0 16px 35px rgba(15, 23, 42, .09);
        }

        .order-header {
            padding: 18px 20px;
            border-bottom: 1px solid #f0f1f3;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .order-number {
            font-size: 17px;
            font-weight: 850;
        }

        .order-date {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status.pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status.paid,
        .status.paid,
        .status.active {
            background: #f0fdf4;
            color: #15803d;
        }

        .status.failed,
        .status.rejected,
        .status.cancelled,
        .status.expired {
            background: #fef2f2;
            color: #b91c1c;
        }

        .order-body {
            padding: 20px;
        }

        .order-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #9ca3af;
            font-weight: 850;
            margin-bottom: 9px;
        }

        .customer-name {
            font-size: 16px;
            font-weight: 800;
        }

        .info-line {
            margin-top: 5px;
            color: #4b5563;
            font-size: 13px;
            word-break: break-word;
        }

        .info-line strong {
            color: #111827;
        }

        .payment-box {
            background: #f8fafc;
            border: 1px solid #eef0f3;
            border-radius: 14px;
            padding: 13px;
        }

        .items-box {
            display: grid;
            gap: 9px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 9px;
            border-bottom: 1px dashed #e5e7eb;
        }

        .item-row:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .item-name {
            font-weight: 700;
            font-size: 13px;
        }

        .item-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }

        .item-price {
            font-weight: 800;
            white-space: nowrap;
        }

        .order-total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            font-weight: 850;
            font-size: 16px;
        }

        /* =====================================================
           ACTION AREA
        ====================================================== */

        .order-actions {
            padding: 16px 20px;
            background: #fafbfc;
            border-top: 1px solid #eef0f3;
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 42px;
            border: 0;
            border-radius: 11px;
            padding: 9px 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-weight: 750;
            transition: .2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--primary-color);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-purple {
            background: var(--purple);
            color: #fff;
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        /* =====================================================
           SKELETON
        ====================================================== */

        .skeleton {
            position: relative;
            overflow: hidden;
            background: #e5e7eb;
            border-radius: 8px;
        }

        .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.65),
                    transparent
                );
            animation: shimmer 1.25s infinite;
        }

        .skeleton-card {
            height: 230px;
            border-radius: 20px;
        }

        /* =====================================================
           EMPTY
        ====================================================== */

        .empty-state {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 55px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: #eff6ff;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .empty-state h3 {
            margin: 0;
            color: #111827;
            font-size: 19px;
            font-weight: 800;
        }

        .empty-state p {
            margin: 7px auto 0;
            max-width: 480px;
            font-size: 13px;
        }

        /* =====================================================
           MODAL
        ====================================================== */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, .62);
            backdrop-filter: blur(7px);
        }

        .modal-card {
            position: relative;
            width: min(700px, 100%);
            max-height: calc(100vh - 30px);
            overflow-y: auto;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(0,0,0,.25);
            animation: modalIn .3s ease;
        }

        .modal-header {
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 21px;
            font-weight: 850;
        }

        .close-modal {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            background: #f3f4f6;
            color: #374151;
        }

        .modal-body {
            padding: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 750;
            color: #374151;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .input {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            border: 0;
            background: transparent;
            color: #6b7280;
        }

        .modal-footer {
            padding: 17px 22px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 9px;
        }

        /* =====================================================
           TOAST
        ====================================================== */

        .toast-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
            display: grid;
            gap: 10px;
            width: min(380px, calc(100% - 30px));
        }

        .toast {
            background: #111827;
            color: #fff;
            padding: 14px 16px;
            border-radius: 13px;
            box-shadow: 0 15px 35px rgba(0,0,0,.2);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: toastIn .3s ease;
            font-size: 13px;
        }

        .toast.success {
            background: #166534;
        }

        .toast.error {
            background: #991b1b;
        }

        /* =====================================================
           ANIMATIONS
        ====================================================== */

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 1100px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .order-layout {
                grid-template-columns: 1fr 1fr;
            }

            .order-layout > :last-child {
                grid-column: 1 / -1;
            }

            .filters {
                grid-template-columns:
                    1fr 1fr;
            }

        }


        @media (max-width: 700px) {

            .header-inner {
                width: min(100% - 20px, 1500px);
                min-height: 64px;
            }

            .brand-subtitle,
            .admin-badge {
                display: none;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand img {
                width: 38px;
                height: 38px;
            }

            .container-main {
                width: min(100% - 20px, 1500px);
                padding-top: 20px;
            }

            .page-heading {
                align-items: stretch;
                flex-direction: column;
            }

            .refresh-btn {
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-icon {
                width: 40px;
                height: 40px;
            }

            .stat-value {
                font-size: 20px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
            }

            .order-layout {
                grid-template-columns: 1fr;
            }

            .order-layout > :last-child {
                grid-column: auto;
            }

            .order-body {
                padding: 16px;
            }

            .order-header {
                padding: 16px;
            }

            .order-actions {
                padding: 14px 16px;
                display: grid;
                grid-template-columns: 1fr;
            }

            .order-actions .btn {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .modal {
                padding: 8px;
            }

            .modal-card {
                border-radius: 18px;
                max-height: calc(100vh - 16px);
            }

            .modal-footer {
                display: grid;
                grid-template-columns: 1fr;
            }

            .modal-footer .btn {
                width: 100%;
            }

        }


        @media (max-width: 420px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .page-heading h1 {
                font-size: 28px;
            }

            .back-btn span {
                display: none;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="admin-header">

        <div class="header-inner">

            <div class="brand">

                <img
                    src="/images/next_level.png"
                    alt="Next Level Subs"
                >

                <div>

                    <div class="brand-title">
                        NEXT LEVEL SUBS
                    </div>

                    <div class="brand-subtitle">
                        Order Management
                    </div>

                </div>

            </div>


            <div style="
                display:flex;
                align-items:center;
                gap:10px;
            ">

                <span class="admin-badge">

                    <i class="fas fa-shield-halved"></i>

                    Administrator

                </span>


                <a
                    href="dashboard.html"
                    class="back-btn"
                >

                    <i class="fas fa-arrow-left"></i>

                    <span>
                        Dashboard
                    </span>

                </a>

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="container-main">

        <div class="page-heading">

            <div>

                <h1>
                    Orders
                </h1>

                <p>
                    Manage payments, subscriptions and customer
                    account delivery.
                </p>

            </div>


            <button
                id="refreshBtn"
                class="refresh-btn"
                type="button"
            >

                <i class="fas fa-rotate"></i>

                Refresh

            </button>

        </div>


        <!-- =================================================
             STATS
        ================================================== -->

        <section
            class="stats-grid"
            id="statsGrid"
        >

            <div class="stat-card">

                <div class="stat-icon blue">

                    <i class="fas fa-shopping-cart"></i>

                </div>

                <div>

                    <div class="stat-label">
                        Total Orders
                    </div>

                    <div
                        id="totalOrders"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon orange">

                    <i class="fas fa-clock"></i>

                </div>

                <div>

                    <div class="stat-label">
                        Pending Payment
                    </div>

                    <div
                        id="pendingOrders"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon green">

                    <i class="fas fa-circle-check"></i>

                </div>

                <div>

                    <div class="stat-label">
                        paid
                    </div>

                    <div
                        id="paidOrders"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon purple">

                    <i class="fas fa-wallet"></i>

                </div>

                <div>

                    <div class="stat-label">
                        Revenue
                    </div>

                    <div
                        id="totalRevenue"
                        class="stat-value"
                    >
                        ৳0.00
                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             FILTERS
        ================================================== -->

        <section class="filter-card">

            <div class="filters">

                <input
                    id="searchInput"
                    class="input"
                    type="search"
                    placeholder="Search order, customer, email..."
                >


                <select
                    id="statusFilter"
                    class="input"
                >

                    <option value="all">
                        All payment statuses
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="paid">
                        Paid
                    </option>

                    <option value="paid">
                        paid
                    </option>

                    <option value="failed">
                        Failed
                    </option>

    <!-- =====================================================

    <script>

        "use strict";


        /* =====================================================
           STATE
        ====================================================== */

        let currentUser = null;

        let allOrders = [];

        let filteredOrders = [];

        let selectedOrder = null;

        let isLoading = false;


        /* =====================================================
           DOM
        ====================================================== */

        const ordersContainer =
            document.getElementById(
                "ordersContainer"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const statusFilter =
            document.getElementById(
                "statusFilter"
            );

        const subscriptionFilter =
            document.getElementById(
                "subscriptionFilter"
            );

        const refreshBtn =
            document.getElementById(
                "refreshBtn"
            );


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           MONEY
        ====================================================== */

        function money(value) {

            return Number(
                value || 0
            ).toFixed(2);

        }


        /* =====================================================
           DATE
        ====================================================== */

        function formatDate(value) {

            if (!value) {
                return "—";
            }

            const date =
                new Date(value);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return escapeHTML(
                    value
                );

            }

            return date.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* =====================================================
           TOAST
        ====================================================== */

        function showToast(
            message,
            type = "success"
        ) {

            const toast =
                document.createElement(
                    "div"
                );

            toast.className =
                `toast ${type}`;

            const icon =
                type === "success"
                    ? "fa-circle-check"
                    : "fa-circle-exclamation";

            toast.innerHTML = `

                <i
                    class="fas ${icon}"
                    style="margin-top:2px;"
                ></i>

                <div>
                    ${escapeHTML(message)}
                </div>

            `;

            document
                .getElementById(
                    "toastContainer"
                )
                .appendChild(toast);


            setTimeout(() => {

                toast.style.opacity =
                    "0";

                toast.style.transform =
                    "translateY(10px)";

                setTimeout(() => {

                    toast.remove();

                }, 250);

            }, 3500);

        }


        /* =====================================================
           ADMIN CHECK
        ====================================================== */

        async function verifyAdmin() {

            const {
                data: authData,
                error: authError
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (
                authError ||
                !authData?.user
            ) {

                window.location.href =
                    "login.html";

                return false;

            }


            currentUser =
                authData.user;


            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("role")
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .single();


            if (
                profileError ||
                String(
                    profile?.role || ""
                ).toLowerCase() !== "admin"
            ) {

                document.body.innerHTML = `

                    <div
                        style="
                            min-height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            padding:20px;
                            background:#f5f7fb;
                        "
                    >

                        <div
                            style="
                                background:#fff;
                                border:1px solid #e5e7eb;
                                border-radius:22px;
                                padding:40px 25px;
                                text-align:center;
                                max-width:450px;
                                width:100%;
                                box-shadow:0 20px 50px rgba(0,0,0,.08);
                            "
                        >

                            <div
                                style="
                                    width:70px;
                                    height:70px;
                                    border-radius:20px;
                                    background:#fef2f2;
                                    color:#dc2626;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    margin:0 auto 18px;
                                    font-size:28px;
                                "
                            >

                                <i class="fas fa-lock"></i>

                            </div>

                            <h1
                                style="
                                    margin:0;
                                    font-size:24px;
                                    font-weight:850;
                                "
                            >
                                Access Denied
                            </h1>

                            <p
                                style="
                                    color:#6b7280;
                                    margin:10px 0 22px;
                                    font-size:14px;
                                "
                            >
                                You do not have permission
                                to access the administrator panel.
                            </p>

                            <a
                                href="dashboard.html"
                                style="
                                    display:inline-flex;
                                    align-items:center;
                                    gap:8px;
                                    padding:11px 18px;
                                    border-radius:11px;
                                    background:#2563eb;
                                    color:#fff;
                                    text-decoration:none;
                                    font-weight:700;
                                "
                            >
                                <i class="fas fa-arrow-left"></i>
                                Back to Dashboard
                            </a>

                        </div>

                    </div>

                `;

                return false;

            }


            return true;

        }


        /* =====================================================
           LOAD ORDERS
        ====================================================== */

        async function loadOrders() {

            if (isLoading) {
                return;
            }

            isLoading = true;

            refreshBtn.classList.add(
                "loading"
            );

            renderSkeletons();


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("orders")
                        .select(`
                            *,
                            order_items (
                                id,
                                product_name,
                                product_image,
                                plan_duration,
                                price,
                                quantity
                            )
                        `)
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {
                    throw error;
                }


                allOrders =
                    data || [];


                await attachSubscriptions();


                updateStats();

                applyFilters();


            }
            catch (error) {

                console.error(
                    "Order loading error:",
                    error
                );

                ordersContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            <i class="fas fa-triangle-exclamation"></i>
                        </div>

                        <h3>
                            Unable to load orders
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message ||
                                "Please try again."
                            )}
                        </p>

                    </div>

                `;

            }
            finally {

                isLoading = false;

                refreshBtn.classList.remove(
                    "loading"
                );

            }

        }


        /* =====================================================
           ATTACH SUBSCRIPTIONS
        ====================================================== */

        async function attachSubscriptions() {

            if (
                !Array.isArray(allOrders) ||
                allOrders.length === 0
            ) {

                return;

            }


            const orderIds =
                allOrders
                    .map(
                        order =>
                            order.id
                    )
                    .filter(Boolean);


            if (
                orderIds.length === 0
            ) {

                return;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("subscriptions")
                    .select(`
                        id,
                        user_id,
                        order_id,
                        product_name,
                        subscription_email,
                        subscription_password,
                        start_date,
                        expiry_date,
                        status,
                        delivery_info,
                        created_at,
                        updated_at
                    `)
                    .in(
                        "order_id",
                        orderIds
                    );


            if (error) {

                console.error(
                    "Subscription loading error:",
                    error
                );

                return;

            }


            const subscriptionMap =
                new Map();


            (
                data || []
            ).forEach(
                subscription => {

                    subscriptionMap.set(
                        subscription.order_id,
                        subscription
                    );

                }
            );


            allOrders =
                allOrders.map(
                    order => ({

                        ...order,

                        subscription:
                            subscriptionMap.get(
                                order.id
                            ) || null

                    })
                );

        }


        /* =====================================================
           STATS
        ====================================================== */

        function updateStats() {

            const total =
                allOrders.length;


            const pending =
                allOrders.filter(
                    order =>
                        String(
                            order.payment_status ||
                            ""
                        ).toLowerCase() ===
                        "pending"
                ).length;


            const paid =
                allOrders.filter(
                    order => {

                        const status =
                            String(
                                order.payment_status ||
                                ""
                            ).toLowerCase();

                        return (
                            status === "paid" ||
                            status === "paid"
                        );

                    }
                ).length;


            const revenue =
                allOrders
                    .filter(
                        order => {

                            const status =
                                String(
                                    order.payment_status ||
                                    ""
                                ).toLowerCase();

                            return (
                                status === "paid" ||
                                status === "paid"
                            );

                        }
                    )
                    .reduce(
                        (
                            total,
                            order
                        ) =>
                            total +
                            Number(
                                order.total || 0
                            ),
                        0
                    );


            document.getElementById(
                "totalOrders"
            ).textContent =
                total;


            document.getElementById(
                "pendingOrders"
            ).textContent =
                pending;


            document.getElementById(
                "paidOrders"
            ).textContent =
                paid;


            document.getElementById(
                "totalRevenue"
            ).textContent =
                `৳${money(revenue)}`;

        }


        /* =====================================================
           SKELETON
        ====================================================== */

        function renderSkeletons() {

            ordersContainer.innerHTML = `

                <div class="skeleton skeleton-card"></div>

                <div class="skeleton skeleton-card"></div>

                <div class="skeleton skeleton-card"></div>

            `;

        }


        /* =====================================================
           PAYMENT STATUS CLASS
        ====================================================== */

        function statusClass(status) {

            const value =
                String(
                    status || "pending"
                ).toLowerCase();

            if (
                [
                    "paid",
                    "paid",
                    "active"
                ].includes(value)
            ) {

                return "paid";

            }

            if (
                [
                    "failed",
                    "rejected",
                    "cancelled",
                    "expired"
                ].includes(value)
            ) {

                return "failed";

            }

            return "pending";

        }


        /* =====================================================
           FILTERS
        ====================================================== */

        function applyFilters() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const status =
                statusFilter.value;


            const subscription =
                subscriptionFilter.value;


            filteredOrders =
                allOrders.filter(
                    order => {

                        const searchable = [

                            order.order_number,

                            order.customer_name,

                            order.email,

                            order.phone,

                            order.payment_reference,

                            order.payment_method

                        ]
                            .filter(Boolean)
                            .join(" ")
                            .toLowerCase();


                        const matchesSearch =
                            !search ||
                            searchable.includes(
                                search
                            );


                        const orderStatus =
                            String(
                                order.payment_status ||
                                "pending"
                            ).toLowerCase();


                        const matchesStatus =
                            status === "all" ||
                            orderStatus ===
                            status;


                        const hasSubscription =
                            Boolean(
                                order.subscription
                            );


                        const matchesSubscription =
                            subscription ===
                            "all" ||

                            (
                                subscription ===
                                "created" &&
                                hasSubscription
                            ) ||

                            (
                                subscription ===
                                "not_created" &&
                                !hasSubscription
                            );


                        return (
                            matchesSearch &&
                            matchesStatus &&
                            matchesSubscription
                        );

                    }
                );


            renderOrders();

        }


        /* =====================================================
           RENDER ORDERS
        ====================================================== */

        function renderOrders() {

            if (
                filteredOrders.length === 0
            ) {

                ordersContainer.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">

                            <i class="fas fa-inbox"></i>

                        </div>

                        <h3>
                            No orders found
                        </h3>

                        <p>
                            There are no orders matching
                            your current filters.
                        </p>

                    </div>

                `;

                return;

            }


            ordersContainer.innerHTML =
                filteredOrders
                    .map(
                        (
                            order,
                            index
                        ) =>
                            renderOrder(
                                order,
                                index
                            )
                    )
                    .join("");

        }


        /* =====================================================
           RENDER ORDER
        ====================================================== */

        function renderOrder(
            order,
            index
        ) {

            const paymentStatus =
                String(
                    order.payment_status ||
                    "pending"
                ).toLowerCase();


            const subscription =
                order.subscription;

                subscription?.status ||
                "";


            const items =
                Array.isArray(
                    order.order_items
                )
                    ? order.order_items
                    : [];


            const paymentMethod =
                getPaymentLabel(
                    order.payment_method
                );


            return `

                <article
                    class="order-card"
                    style="
                        animation-delay:${Math.min(
                            index * 45,
                            400
                        )}ms;
                    "
                >

                    <div class="order-header">

                        <div>

                            <div class="order-number">

                                ${escapeHTML(
                                    order.order_number ||
                                    order.id
                                )}

                            </div>

                            <div class="order-date">

                                ${formatDate(
                                    order.created_at
                                )}

                            </div>

                        </div>


                        <div
                            style="
                                display:flex;
                                gap:7px;
                                align-items:center;
                                flex-wrap:wrap;
                                justify-content:flex-end;
                            "
                        >

                            <span
                                class="
                                    status
                                    ${statusClass(
                                        paymentStatus
                                    )}
                                "
                            >

                                <i
                                    class="
                                        fas
                                        fa-circle
                                    "
                                    style="font-size:7px;"
                                ></i>

                                ${escapeHTML(
                                    capitalize(
                                        paymentStatus
                                    )
                                )}

                            </span>


                            ${
                                subscription
                                    ? `
                                        <span
                                            class="
                                                status
                                                ${statusClass(
                                                    subscriptionStatus
                                                )}
                                            "
                                        >

                                            <i class="fas fa-key"></i>

                                            Subscription

                                        </span>
                                    `
                                    : ""
                            }

                        </div>

                    </div>


                    <div class="order-body">

                        <div class="order-layout">


                            <!-- CUSTOMER -->

                            <div>

                                <div class="section-title">
                                    Customer
                                </div>

                                <div class="customer-name">

                                    ${escapeHTML(
                                        order.customer_name ||
                                        "Unknown Customer"
                                    )}

                                </div>

                                <div class="info-line">

                                    <i class="fas fa-envelope"></i>

                                    ${escapeHTML(
                                        order.email ||
                                        "—"
                                    )}

                                </div>

                                <div class="info-line">

                                    <i class="fas fa-phone"></i>

                                    ${escapeHTML(
                                        order.phone ||
                                        "—"
                                    )}

                                </div>

                                ${
                                    order.address
                                        ? `
                                            <div class="info-line">

                                                <i class="fas fa-location-dot"></i>

                                                ${escapeHTML(
                                                    order.address
                                                )}

                                            </div>
                                        `
                                        : ""
                                }

                            </div>


                            <!-- PAYMENT -->

                            <div>

                                <div class="section-title">
                                    Payment
                                </div>

                                <div class="payment-box">

                                    <div class="info-line">

                                        <strong>
                                            Method:
                                        </strong>

                                        ${escapeHTML(
                                            paymentMethod
                                        )}

                                    </div>

                                    <div class="info-line">

                                        <strong>
                                            Amount:
                                        </strong>

                                        ৳${money(
                                            order.total
                                        )}

                                    </div>

                                    <div class="info-line">

                                        <strong>
                                            Sender:
                                        </strong>

                                        ${escapeHTML(
                                            order.payment_sender_number ||
                                            "—"
                                        )}

                                    </div>

                                    <div class="info-line">

                                        <strong>
                                            Reference:
                                        </strong>

                                        ${escapeHTML(
                                            order.payment_reference ||
                                            "—"
                                        )}

                                    </div>

                                </div>

                            </div>


                            <!-- ITEMS -->

                            <div>

                                <div class="section-title">
                                    Order Items
                                </div>

                                <div class="items-box">

                                    ${
                                        items.length
                                            ? items
                                                .map(
                                                    item => `

                                                        <div class="item-row">

                                                            <div>

                                                                <div class="item-name">

                                                                    ${escapeHTML(
                                                                        item.product_name ||
                                                                        "Product"
                                                                    )}

                                                                </div>

                                                                <div class="item-meta">

                                                                    ${escapeHTML(
                                                                        item.plan_duration ||
                                                                        ""
                                                                    )}

                                                                    ${Number(
                                                                        item.quantity ||
                                                                        1

                                                                </div>

                                                            <div class="item-price">

                                                                    Number(

                                                                        item.quantity ||

                                                                )}

                                                .join("")
                                            : `

                                            `

                                    <span>
                                        ৳${money(

                        ${
                            subscription
                                ? renderSubscriptionSummary(
                                    subscription

                        ${

                                "pending"

                                            order.id

                            class="btn btn-purple"

                                order.id
                            )}')"
                        >

                            <i class="fas fa-key"></i>

                            ${
                                subscription
                                    ? "Edit Subscription"
                                    : "Add Subscription"
                            }

                        </button>

                    </div>

                </article>

            `;

        }

        /* =====================================================
           PAYMENT LABEL
        ====================================================== */

        function getPaymentLabel(
            method
        ) {

            const labels = {

                bkash: "bKash",

                nagad: "Nagad",

                rocket: "Rocket",

                upay: "Upay",

                bank_transfer:
                    "Bank Transfer"

            };

            return (
                labels[method] ||
                method ||
                "Unknown"
            );

        }


        /* =====================================================
           CAPITALIZE
        ====================================================== */

        function capitalize(
            value
        ) {

            return String(
                value || ""
            )
                .charAt(0)
                .toUpperCase() +
                String(
                    value || ""
                ).slice(1);

        }


        /* =====================================================
           APPROVE PAYMENT
        ====================================================== */

        async function approvePayment(
            orderId
        ) {

            const order =
                allOrders.find(
                    item =>
                        item.id ===
                        orderId
                );


            if (!order) {

                showToast(
                    "Order not found.",
                    "error"
                );

                return;

            }


            if (!order.user_id) {

                showToast(
                    "This order has no user_id. Cannot approve it safely.",
                    "error"
                );

                return;

            }


            const confirmed =
                window.confirm(
                    `Approve payment for ${order.order_number || order.id}?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const {
                    error
                } =
                    await supabaseClient
                        .from("orders")
                        .update({

                            payment_status:
                                "paid"

                        })
                        .eq(
                            "id",
                            order.id
                        );


                if (error) {
                    throw error;
                }


                showToast(
                    "Payment paid successfully."
                );


                await loadOrders();

            }
            catch (error) {

                console.error(
                    "Payment approval error:",
                    error
                );

                showToast(
                    error.message ||
                    "Unable to approve payment.",
                    "error"
                );

            }

        }


        /* =====================================================
           REJECT PAYMENT
        ====================================================== */

        async function rejectPayment(
            orderId
        ) {

            const order =
                allOrders.find(
                    item =>
                        item.id ===
                        orderId
                );


            if (!order) {
                return;
            }


            const confirmed =
                window.confirm(
                    `Reject payment for ${order.order_number || order.id}?`
                );


            if (!confirmed) {
                return;
            }


            try {

                const {
                    error
                } =
                    await supabaseClient
                        .from("orders")
                        .update({

                            payment_status:
                                "failed"

                        })
                        .eq(
                            "id",
                            order.id
                        );


                if (error) {
                    throw error;
                }


                showToast(
                    "Payment rejected."
                );


                await loadOrders();

            }
            catch (error) {

                console.error(
                    "Payment rejection error:",
                    error
                );

                showToast(
                    error.message ||
                    "Unable to reject payment.",
                    "error"
                );

            }

        }


        /* =====================================================
           OPEN SUBSCRIPTION MODAL
        ====================================================== */

        function openSubscriptionModal(
            orderId
        ) {

            selectedOrder =
                allOrders.find(
                    order =>
                        order.id ===
                        orderId
                );


            if (!selectedOrder) {

                showToast(
                    "Order not found.",
                    "error"
                );

                return;

            }


            const subscription =
                selectedOrder.subscription;


            document.getElementById(
                "modalOrderNumber"
            ).textContent =
                selectedOrder.order_number ||
                selectedOrder.id;


            document.getElementById(
                "subscriptionId"
            ).value =
                subscription?.id ||
                "";


            document.getElementById(
                "subscriptionOrderId"
            ).value =
                selectedOrder.id;


            const firstItem =
                selectedOrder
                    .order_items?.[0];


            document.getElementById(
                "subscriptionProduct"
            ).value =
                subscription?.product_name ||
                firstItem?.product_name ||
                "";


            document.getElementById(
                "subscriptionStatus"
            ).value =
                subscription?.status ||
                "active";


            document.getElementById(
                "subscriptionEmail"
            ).value =
                subscription?.subscription_email ||
                "";


            document.getElementById(
                "subscriptionPassword"
            ).value =
                subscription?.subscription_password ||
                "";


            document.getElementById(
                "subscriptionStart"
            ).value =
                normalizeDateInput(
                    subscription?.start_date ||
                    new Date()
                );


            document.getElementById(
                "subscriptionExpiry"
            ).value =
                normalizeDateInput(
                    subscription?.expiry_date ||
                    addDays(
                        new Date(),
                        30
                    )
                );


            document.getElementById(
                "deliveryInfo"
            ).value =
                subscription?.delivery_info ||
                "";


            document.getElementById(
                "subscriptionModal"
            ).classList.remove(
                "hidden"
            );

        }


        /* =====================================================
           CLOSE MODAL
        ====================================================== */

        function closeSubscriptionModal() {

            document.getElementById(
                "subscriptionModal"
            ).classList.add(
                "hidden"
            );

            selectedOrder =
                null;

        }


        /* =====================================================
           DATE HELPERS
        ====================================================== */

        function normalizeDateInput(
            value
        ) {

            const date =
                value instanceof Date
                    ? value
                    : new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            const year =
                date.getFullYear();


            const month =
                String(
                    date.getMonth() + 1
                ).padStart(2, "0");


            const day =
                String(
                    date.getDate()
                ).padStart(2, "0");


            return `${year}-${month}-${day}`;

        }


        function addDays(
            date,
            days
        ) {

            const result =
                new Date(date);

            result.setDate(
                result.getDate() +
                Number(days)
            );

            return result;

        }


        /* =====================================================
           SAVE SUBSCRIPTION
        ====================================================== */

        async function saveSubscription() {

            if (!selectedOrder) {

                showToast(
                    "No order selected.",
                    "error"
                );

                return;

            }


            /*
             * IMPORTANT:
             *
             * user_id comes directly from
             * orders.user_id.
             *
             * This fixes the NULL user_id
             * problem you previously had.
             */

            if (
                !selectedOrder.user_id
            ) {

                showToast(
                    "This order does not contain a user_id. Subscription cannot be assigned.",
                    "error"
                );

                return;

            }


            const productName =
                document.getElementById(
                    "subscriptionProduct"
                ).value.trim();


            const subscriptionEmail =
                document.getElementById(
                    "subscriptionEmail"
                ).value.trim();


            const subscriptionPassword =
                document.getElementById(
                    "subscriptionPassword"
                ).value;


            const startDate =
                document.getElementById(
                    "subscriptionStart"
                ).value;


            const expiryDate =
                document.getElementById(
                    "subscriptionExpiry"
                ).value;


            const status =
                document.getElementById(
                    "subscriptionStatus"
                ).value;


            const deliveryInfo =
                document.getElementById(
                    "deliveryInfo"
                ).value.trim();


            if (!productName) {

                showToast(
                    "Enter the product name.",
                    "error"
                );

                return;

            }


            if (!startDate) {

                showToast(
                    "Select a start date.",
                    "error"
                );

                return;

            }


            if (!expiryDate) {

                showToast(
                    "Select an expiry date.",
                    "error"
                );

                return;

            }


            const saveButton =
                document.getElementById(
                    "saveSubscription"
                );


            saveButton.disabled =
                true;


            saveButton.innerHTML = `

                <i class="fas fa-spinner fa-spin"></i>

                Saving...

            `;


            try {

                /*
                 * First check whether a subscription
                 * already exists for this order.
                 */

                const {
                    data: existing,
                    error: existingError
                } =
                    await supabaseClient
                        .from("subscriptions")
                        .select("id")
                        .eq(
                            "order_id",
                            selectedOrder.id
                        )
                        .maybeSingle();


                if (existingError) {
                    throw existingError;
                }


                const payload = {

                    user_id:
                        selectedOrder.user_id,

                    order_id:
                        selectedOrder.id,

                    product_name:
                        productName,

                    subscription_email:
                        subscriptionEmail ||
                        null,

                    subscription_password:
                        subscriptionPassword ||
                        null,

                    start_date:
                        startDate,

                    expiry_date:
                        expiryDate,

                    status:
                        status,

                    delivery_info:
                        deliveryInfo ||
                        null

                };


                if (existing?.id) {

                    /*
                     * UPDATE EXISTING SUBSCRIPTION
                     */

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("subscriptions")
                            .update(
                                payload
                            )
                            .eq(
                                "id",
                                existing.id
                            );


                    if (error) {
                        throw error;
                    }


                    showToast(
                        "Subscription updated successfully."
                    );

                }
                else {

                    /*
                     * CREATE NEW SUBSCRIPTION
                     */

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("subscriptions")
                            .insert(
                                payload
                            );


                    if (error) {
                        throw error;
                    }


                    showToast(
                        "Subscription created successfully."
                    );

                }


                /*
                 * Automatically make sure the order
                 * is marked as paid.
                 */

                const {
                    error: orderUpdateError
                } =
                    await supabaseClient
                        .from("orders")
                        .update({

                            payment_status:
                                "paid"

                        })
                        .eq(
                            "id",
                            selectedOrder.id
                        );


                if (orderUpdateError) {

                    console.warn(
                        "Order payment status update failed:",
                        orderUpdateError
                    );

                }


                closeSubscriptionModal();

                await loadOrders();

            }
            catch (error) {

                console.error(
                    "Subscription save error:",
                    error
                );

                showToast(
                    error.message ||
                    "Unable to save subscription.",
                    "error"
                );

            }
            finally {

                saveButton.disabled =
                    false;

                saveButton.innerHTML = `

                    <i class="fas fa-floppy-disk"></i>

                    Save Subscription

                `;

            }

        }


        /* =====================================================
           PASSWORD TOGGLE
        ====================================================== */

        function togglePassword() {

            const input =
                document.getElementById(
                    "subscriptionPassword"
                );

            const button =
                document.getElementById(
                    "togglePassword"
                );


            if (
                input.type ===
                "password"
            ) {

                input.type =
                    "text";

                button.innerHTML =
                    `<i class="fas fa-eye-slash"></i>`;

            }
            else {

                input.type =
                    "password";

                button.innerHTML =
                    `<i class="fas fa-eye"></i>`;

            }

        }

        searchInput.addEventListener(

            applyFilters

            "change",

        subscriptionFilter.addEventListener(

        );

            closeSubscriptionModal

            "saveSubscription"

        );

            "togglePassword"

            togglePassword

        document.addEventListener(

                if (
                    event.key ===

                    closeSubscriptionModal();

                }

            }

        /* =====================================================
           AUTH STATE
        ====================================================== */

        supabaseClient
            .auth
            .onAuthStateChange(
                (
                    event
                ) => {

                    if (
                        event ===
                        "SIGNED_OUT"
                    ) {

                        window.location.href =
                            "login.html";

                    }

                }
            );


        /* =====================================================
           INITIALIZE
        ====================================================== */

        async function init() {

            try {

                const isAdmin =
                    await verifyAdmin();


                if (!isAdmin) {
                    return;
                }


                await loadOrders();

            }
            catch (error) {

                console.error(
                    "Admin initialization error:",
                    error
                );

                showToast(
                    "Unable to initialize admin panel.",
                    "error"
                );

            }

        }


        init();


        /* =====================================================
           GLOBAL FUNCTIONS
           Needed by dynamically generated buttons.
        ====================================================== */

        window.approvePayment =
            approvePayment;

        window.rejectPayment =
            rejectPayment;

        window.openSubscriptionModal =
            openSubscriptionModal;

    </script>
