<!-- UPDATED ADMIN ORDERS UI/LOGIC: multi-product, combo components, plan, quantity, per-component credentials, and custom product override. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Orders - NEXT LEVEL SUBS</title>
<link rel="stylesheet" href="./src/output.css">
<link rel="stylesheet" href="./src/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js"></script>
<script src="./js/products.js"></script>
<style>
:root{--primary:#2563eb;--success:#16a34a;--danger:#dc2626;--warning:#d97706;--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fafc,#eef4ff);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.page{width:min(1500px,calc(100% - 32px));margin:auto;padding:30px 0 60px}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.header-inner{width:min(1500px,calc(100% - 32px));min-height:72px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed)}.brand-title{font-weight:900}.brand-subtitle{font-size:12px;color:var(--muted)}button,input,select,textarea{font:inherit}.toolbar,.card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 35px rgba(15,23,42,.07)}.toolbar{margin:22px 0;padding:15px;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1 1 300px;height:44px;border:1px solid var(--border);border-radius:12px;padding:0 14px}.select,.btn{height:44px;border:1px solid var(--border);border-radius:12px;padding:0 13px;background:#fff}.btn{font-weight:700;cursor:pointer}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.orders{display:grid;gap:18px}.order-card{overflow:hidden}.order-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.order-no{font-size:17px;font-weight:900}.muted{color:var(--muted);font-size:12px}.order-body{padding:20px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.info{background:#fafbfc;border:1px solid #edf0f4;border-radius:14px;padding:15px}.info-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted);margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13px}.row span:first-child{color:var(--muted)}.row span:last-child{text-align:right;font-weight:700;word-break:break-word}.products{margin-top:18px}.product{border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:10px}.product-top{padding:14px;display:flex;gap:12px;align-items:center;background:#fafbfc}.product-img{width:52px;height:52px;border-radius:13px;object-fit:contain;background:#fff;padding:5px;border:1px solid #eee}.product-name{font-weight:900}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:11px;font-weight:800;margin:3px 3px 0 0}.component-wrap{padding:14px}.component{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:10px;background:#fff}.component-title{font-weight:900;display:flex;justify-content:space-between;gap:10px;align-items:center}.component-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:9px 10px;outline:none;background:#fff}.field textarea{min-height:70px;resize:vertical}.component-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.save{background:var(--success);border:0;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.custom-box{padding:12px 14px;border-top:1px solid var(--border);background:#fff}.custom-row{display:grid;grid-template-columns:1fr auto;gap:9px}.custom-row input{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:9px}.empty,.loading{padding:50px;text-align:center;color:var(--muted)}.danger{color:var(--danger)}.status{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;background:#fff7ed;color:#c2410c}.status.paid{background:#f0fdf4;color:#15803d}.status.failed,.status.cancelled{background:#fef2f2;color:#b91c1c}@media(max-width:800px){.grid2,.component-grid{grid-template-columns:1fr}.page{width:min(100% - 20px,1500px)}.product-top{align-items:flex-start}.order-body{padding:14px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="brand"><div class="brand-icon"><i class="fas fa-boxes-stacked"></i></div><div><div class="brand-title">NEXT LEVEL SUBS</div><div class="brand-subtitle">Order Management</div></div></div><div style="display:flex;gap:8px;align-items:center"><button class="btn" id="homeBtn" type="button"><i class="fas fa-house"></i> Home</button><button class="btn" id="refreshBtn"><i class="fas fa-rotate"></i> Refresh</button></div></div></header>
<main class="page"><h1 style="margin:0;font-size:32px;font-weight:900">Orders</h1><p class="muted" style="font-size:14px;margin-top:6px">Manage products, plans, quantities and individual subscription delivery details.</p><div class="toolbar"><input id="searchInput" class="search" placeholder="Filter by order, customer, email, phone or product..."><select id="statusFilter" class="select"><option value="all">All statuses</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select></div><section id="ordersContainer" class="orders"><div class="loading">Loading orders...</div></section></main>
<script>
"use strict";
const ordersContainer=document.getElementById("ordersContainer"),searchInput=document.getElementById("searchInput"),statusFilter=document.getElementById("statusFilter"),refreshBtn=document.getElementById("refreshBtn"),homeBtn=document.getElementById("homeBtn");
homeBtn.addEventListener("click",()=>{window.location.href="./index.html"});
let orders=[];
const esc=v=>v==null?"":String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
const money=v=>`৳${Number(v||0).toFixed(2)}`;
function catalog(){return window.NextLevelSubs?.subscriptions||window.products||[]}
function productByName(name){return catalog().find(p=>p.name===name)||null}
function slugify(name){return String(name||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function statusClass(s){return ["paid","failed","cancelled","refunded"].includes(String(s||"").toLowerCase())?String(s).toLowerCase():""}
function productImage(item){const p=productByName(item.product_name);return item.product_image||p?.image||""}
function planText(item){return item.plan_duration||item.duration||"Plan not specified"}
function comboServices(item){const p=productByName(item.product_name);return Array.isArray(p?.services)?p.services:[]}
function makeFallbackServices(item){return comboServices(item).length?comboServices(item):[item.product_name]}
function componentFields(c,index,service,oiId){return `<div class="component" data-component-id="${esc(c?.id||"")}" data-order-item-id="${esc(oiId)}"><div class="component-title"><span><i class="fas fa-key"></i> ${esc(service||c?.service_name||`Delivery ${index+1}`)}</span><span class="pill">Slot ${index+1}</span></div><div class="component-grid"><div class="field"><label>Custom Product / Service Name</label><input data-field="service_name" value="${esc(c?.service_name||service||"")}"></div><div class="field"><label>Plan</label><input data-field="plan_duration" value="${esc(c?.plan_duration||"")}" placeholder="1 month"></div><div class="field"><label>Email / Account</label><input data-field="subscription_email" value="${esc(c?.subscription_email||"")}" placeholder="Account email"></div><div class="field"><label>Password</label><input data-field="subscription_password" value="${esc(c?.subscription_password||"")}" placeholder="Password"></div><div class="field"><label>Subscription Start</label><input type="datetime-local" data-field="subscription_start" value="${esc(localInput(c?.subscription_start))}"></div><div class="field"><label>Subscription Expiry</label><input type="datetime-local" data-field="subscription_expiry" value="${esc(localInput(c?.subscription_expiry))}"></div><div class="field" style="grid-column:1/-1"><label>Delivery Information</label><textarea data-field="delivery_note" placeholder="Profile, PIN, activation instructions, etc.">${esc(c?.delivery_note||"")}</textarea></div></div><div class="component-actions"><button class="save" data-action="save-component"><i class="fas fa-floppy-disk"></i> Save ${esc(service||"Details")}</button></div></div>`}
function localInput(v){if(!v)return "";const d=new Date(v);if(Number.isNaN(d.getTime()))return "";const z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
async function loadOrders(){ordersContainer.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>';try{const {data:user,error:ue}=await supabaseClient.auth.getUser();if(ue)throw ue;if(!user?.user)throw new Error("Not logged in");const {data:profile}=await supabaseClient.from("profiles").select("role").eq("id",user.user.id).maybeSingle();if(String(profile?.role||"").toLowerCase()!=="admin")throw new Error("Admin access required");const {data,error}=await supabaseClient.from("orders").select("*").order("created_at",{ascending:false});if(error)throw error;orders=data||[];await loadItemsAndComponents();render();}catch(e){console.error(e);ordersContainer.innerHTML=`<div class="empty"><i class="fas fa-triangle-exclamation"></i><br><br>${esc(e.message||"Unable to load orders")}</div>`}}
async function loadItemsAndComponents(){if(!orders.length)return;const ids=orders.map(o=>o.id);const {data:items,error}=await supabaseClient.from("order_items").select("*").in("order_id",ids);if(error)throw error;const itemIds=(items||[]).map(i=>i.id);let components=[];if(itemIds.length){const r=await supabaseClient.from("order_item_components").select("*").in("order_item_id",itemIds);if(r.error)throw r.error;components=r.data||[]}orders=orders.map(o=>({...o,order_items:(items||[]).filter(i=>i.order_id===o.id).map(i=>({...i,components:components.filter(c=>c.order_item_id===i.id)}))}))}
function render(){const q=searchInput.value.trim().toLowerCase(),st=statusFilter.value;const filtered=orders.filter(o=>{const items=o.order_items||[];const hay=[o.order_number,o.customer_name,o.email,o.phone,...items.map(i=>i.product_name)].join(" ").toLowerCase();return(!q||hay.includes(q))&&(st==="all"||String(o.payment_status||"").toLowerCase()===st||String(o.order_status||"").toLowerCase()===st)});if(!filtered.length){ordersContainer.innerHTML='<div class="empty">No orders found.</div>';return}ordersContainer.innerHTML=filtered.map(renderOrder).join("")}
function renderOrder(o){const items=o.order_items||[];return `<article class="card order-card"><div class="order-head"><div><div class="order-no">${esc(o.order_number||o.id)}</div><div class="muted">${esc(formatDate(o.created_at))}</div></div><div><span class="status ${statusClass(o.payment_status)}">Payment: ${esc(o.payment_status||"pending")}</span> <span class="status">Order: ${esc(o.order_status||"pending")}</span></div></div><div class="order-body"><div class="grid2"><div class="info"><div class="info-title">Customer</div><div class="row"><span>Name</span><span>${esc(o.customer_name)}</span></div><div class="row"><span>Email</span><span>${esc(o.email)}</span></div><div class="row"><span>Phone</span><span>${esc(o.phone)}</span></div><div class="row"><span>Address</span><span>${esc(o.address)}</span></div></div><div class="info"><div class="info-title">Payment</div><div class="row"><span>Method</span><span>${esc(o.payment_method)}</span></div><div class="row"><span>Sender</span><span>${esc(o.payment_sender_number)}</span></div><div class="row"><span>Reference</span><span>${esc(o.payment_reference)}</span></div><div class="row"><span>Total</span><span>${money(o.total)}</span></div></div></div><div class="products"><div class="section-title">Ordered Products (${items.length})</div>${items.map((i,n)=>renderItem(i,n,o.id)).join("")}</div></div></article>`}
function renderItem(i,n,orderId){const p=productByName(i.product_name),img=productImage(i),qty=Math.max(1,Number(i.quantity||1)),services=makeFallbackServices(i),existing=i.components||[];let slots=[];for(let q=1;q<=qty;q++){for(let s=0;s<services.length;s++){const slot=((q-1)*services.length)+s+1;const c=existing.find(x=>Number(x.slot_number)===slot)||existing[slot-1]||null;slots.push(componentFields(c,slot,services[s],i.id))}}return `<div class="product"><div class="product-top">${img?`<img class="product-img" src="${esc(img)}" alt="${esc(i.product_name)}">`:`<div class="product-img" style="display:grid;place-items:center"><i class="fas fa-box"></i></div>`}<div style="min-width:0;flex:1"><div class="product-name">${esc(i.product_name||"Product")}</div><span class="pill">Plan: ${esc(planText(i))}</span><span class="pill">Quantity: ${qty}</span>${p?.categories?.includes("combo")?'<span class="pill">COMBO</span>':''}</div><div style="font-weight:900">${money(Number(i.price||0)*qty)}</div></div><div class="custom-box"><div class="info-title">Admin Custom Product Name</div><div class="custom-row"><input data-custom-item="${esc(i.id)}" value="${esc(i.custom_product_name||"")}" placeholder="Leave empty to use ordered product name"><button class="btn btn-primary" data-action="save-custom" data-item-id="${esc(i.id)}">Save</button></div></div><div class="component-wrap"><div style="font-size:13px;font-weight:900">Individual Delivery Details</div>${slots.join("")}</div></div>`}
function formatDate(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}
ordersContainer.addEventListener("click",async e=>{const btn=e.target.closest("button[data-action]");if(!btn)return;const action=btn.dataset.action;try{if(action==="save-custom"){const input=document.querySelector(`input[data-custom-item="${CSS.escape(btn.dataset.itemId)}"]`);const {error}=await supabaseClient.from("order_items").update({custom_product_name:input?.value.trim()||null}).eq("id",btn.dataset.itemId);if(error)throw error;await loadOrders()}else if(action==="save-component"){const box=btn.closest(".component");const orderItemId=box.dataset.orderItemId;const payload={order_item_id:orderItemId,service_name:box.querySelector('[data-field="service_name"]').value.trim()||null,plan_duration:box.querySelector('[data-field="plan_duration"]').value.trim()||null,subscription_email:box.querySelector('[data-field="subscription_email"]').value.trim()||null,subscription_password:box.querySelector('[data-field="subscription_password"]').value||null,delivery_note:box.querySelector('[data-field="delivery_note"]').value.trim()||null,subscription_start:box.querySelector('[data-field="subscription_start"]').value||null,subscription_expiry:box.querySelector('[data-field="subscription_expiry"]').value||null};const componentId=box.dataset.componentId;let r;if(componentId){r=await supabaseClient.from("order_item_components").update(payload).eq("id",componentId)}else{payload.slot_number=Number((box.querySelector(".pill")?.textContent||"").replace(/\D/g,""))||1;r=await supabaseClient.from("order_item_components").insert(payload)}if(r.error)throw r.error;await loadOrders()}}catch(err){console.error(err);alert(err.message||"Save failed")}});
searchInput.addEventListener("input",render);statusFilter.addEventListener("change",render);refreshBtn.addEventListener("click",loadOrders);loadOrders();
</script>
</body>
</html>
