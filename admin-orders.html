<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders - NEXT LEVEL SUBS</title>
    <meta name="description" content="NEXT LEVEL SUBS administrator order management panel.">

    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./src/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-config.js"></script>
    <script src="js/products.js"></script>

    <style>
        /* =========================================================
           ROOT & BASE
        ========================================================= */
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --warning-color: #d97706;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --radius: 18px;
            --shadow: 0 10px 35px rgba(15, 23, 42, 0.07);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
        }

        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }

        /* HEADER */
        .admin-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(229,231,235,0.8);
        }
        .header-inner {
            width: min(1500px, calc(100% - 32px)); margin: auto;
            min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-icon {
            width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; color: white;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 8px 20px rgba(37,99,235,.25);
        }
        .brand-title { font-size: 17px; font-weight: 800; white-space: nowrap; }
        .brand-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .header-btn {
            width: 42px; height: 42px; border: 1px solid var(--border); background: white;
            border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #374151;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .header-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,23,42,.08); background: #f8fafc; }

        /* PAGE & STATS */
        .page { width: min(1500px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 60px; }
        .page-title { animation: slideDown .45s ease both; }
        .page-title h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); font-weight: 900; letter-spacing: -0.03em; }
        .page-title p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 26px; }
        .stat-card {
            background: var(--card); border: 1px solid rgba(229,231,235,.8); border-radius: var(--radius);
            padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; animation: fadeUp .45s ease both;
        }
        .stat-card::after { content: ""; position: absolute; width: 100px; height: 100px; border-radius: 50%; background: rgba(37,99,235,.06); right: -35px; top: -35px; }
        .stat-label { color: var(--muted); font-size: 13px; font-weight: 600; }
        .stat-value { margin-top: 8px; font-size: 27px; font-weight: 900; }
        .stat-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .blue { background: #eff6ff; color: #2563eb; } .yellow { background: #fffbeb; color: #d97706; }
        .green { background: #f0fdf4; color: #16a34a; } .purple { background: #faf5ff; color: #9333ea; }

        /* TOOLBAR */
        .toolbar { margin-top: 24px; padding: 16px; background: white; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .search-box { flex: 1 1 280px; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .search-box input { width: 100%; height: 46px; border: 1px solid var(--border); border-radius: 12px; padding: 0 15px 0 43px; outline: none; transition: border-color .2s ease, box-shadow .2s ease; }
        .search-box input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(37,99,235,.08); }
        .filter-select { height: 46px; min-width: 170px; border: 1px solid var(--border); border-radius: 12px; padding: 0 13px; background: white; outline: none; }
        .refresh-btn { height: 46px; padding: 0 17px; border: none; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 7px 18px rgba(37,99,235,.2); transition: transform .2s ease; }
        .refresh-btn:hover { transform: translateY(-2px); }

        /* ORDERS & PRODUCTS */
        #ordersContainer { margin-top: 22px; display: grid; gap: 18px; }
        .order-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; animation: fadeUp .45s ease both; transition: transform .2s ease, box-shadow .2s ease; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 16px 45px rgba(15,23,42,.09); }
        .order-header { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .order-number { font-size: 16px; font-weight: 900; }
        .order-date { color: var(--muted); font-size: 12px; margin-top: 4px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; }
        .status-pending { background: #fff7ed; color: #c2410c; } .status-paid { background: #f0fdf4; color: #15803d; }
        .status-failed { background: #fef2f2; color: #b91c1c; } .status-cancelled { background: #f3f4f6; color: #4b5563; } .status-refunded { background: #faf5ff; color: #7e22ce; }
        .order-body { padding: 20px; }

        .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
        .info-box { border: 1px solid #edf0f4; background: #fafbfc; border-radius: 14px; padding: 16px; }
        .info-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 13px; }
        .info-row span:first-child { color: #6b7280; } .info-row span:last-child { font-weight: 700; text-align: right; word-break: break-word; }

        .products-section { margin-top: 18px; }
        .section-title { font-size: 15px; font-weight: 900; margin-bottom: 10px; }
        .product-list { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        .product-item { display: flex; flex-direction: column; gap: 13px; padding: 15px; border-bottom: 1px solid #f0f1f3; }
        .product-item:last-child { border-bottom: none; }
        .product-main { display: flex; gap: 13px; align-items: center; }
        .product-name { font-weight: 800; font-size: 14px; }
        .product-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 5px; }
        .product-tag { background: #f3f4f6; color: #4b5563; padding: 4px 7px; border-radius: 7px; font-size: 11px; font-weight: 700; }
        .product-price { text-align: right; font-weight: 900; white-space: nowrap; margin-left: auto; }

        /* COMPONENTS */
        .component-box { margin-top: 10px; background: #f8fbff; border: 1px solid #dbeafe; border-radius: 12px; padding: 12px; }
        .component-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .component-title { font-size: 13px; font-weight: 800; color: #1e40af; }

        /* TOTALS & ACTIONS */
        .totals { margin-top: 18px; display: flex; justify-content: flex-end; }
        .totals-box { width: min(100%, 360px); background: #f8fafc; border-radius: 14px; padding: 14px 16px; }
        .total-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
        .total-row.grand { border-top: 1px solid var(--border); margin-top: 7px; padding-top: 12px; font-size: 18px; font-weight: 900; }

        .admin-actions { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn { min-height: 42px; padding: 0 15px; border: none; border-radius: 11px; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform .2s ease, opacity .2s ease; }
        .action-btn:hover { transform: translateY(-2px); }
        .action-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        .btn-success { color: white; background: linear-gradient(135deg, #16a34a, #15803d); }
        .btn-danger { color: white; background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-primary { color: white; background: linear-gradient(135deg, #2563eb, #4f46e5); }
        .btn-secondary { color: #374151; background: #f3f4f6; border: 1px solid #e5e7eb; }

        /* MODAL */
        .modal { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(15,23,42,.55); backdrop-filter: blur(8px); }
        .modal.show { display: flex; animation: fadeIn .2s ease; }
        .modal-card { width: min(100%, 640px); max-height: calc(100vh - 36px); overflow-y: auto; background: white; border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.25); animation: modalIn .25s ease; }
        .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .modal-title { font-size: 18px; font-weight: 900; }
        .modal-close { width: 36px; height: 36px; border: none; border-radius: 10px; background: #f3f4f6; color: #4b5563; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field.full { grid-column: 1 / -1; }
        .form-field label { font-size: 12px; font-weight: 800; color: #4b5563; }
        .form-field input, .form-field textarea, .form-field select { width: 100%; border: 1px solid #dbe0e7; border-radius: 10px; background: white; padding: 10px 12px; outline: none; transition: border-color .2s ease, box-shadow .2s ease; }
        .form-field input, .form-field select { height: 43px; }
        .form-field textarea { min-height: 82px; resize: vertical; }
        .form-field input:focus, .form-field textarea:focus, .form-field select:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.08); }
        .delivery-note { margin-top: 10px; padding: 11px 12px; background: #ecfdf5; border: 1px solid #bbf7d0; border-radius: 10px; color: #166534; font-size: 12px; }

        /* MISC */
        .empty-state { text-align: center; background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 60px 20px; box-shadow: var(--shadow); }
        .empty-icon { width: 65px; height: 65px; margin: 0 auto 15px; border-radius: 20px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 25px; }
        .skeleton { position: relative; overflow: hidden; background: #e5e7eb; }
        .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 1.4s infinite; }
        .skeleton-card { height: 310px; border-radius: var(--radius); }

        #toastContainer { position: fixed; right: 18px; bottom: 18px; z-index: 1000; display: grid; gap: 10px; width: min(360px, calc(100% - 36px)); }
        .toast { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; box-shadow: 0 15px 40px rgba(15,23,42,.15); display: flex; align-items: flex-start; gap: 10px; animation: toastIn .3s ease; }
        .toast.success i { color: #16a34a; } .toast.error i { color: #dc2626; }
        .toast-message { font-size: 13px; font-weight: 700; line-height: 1.45; }

        /* Sub Status Badge in Component List */
        .sub-status-active { color: #15803d; font-weight: 800; background: #dcfce7; padding: 2px 6px; border-radius: 6px; font-size: 10px; }
        .sub-status-expired { color: #b91c1c; font-weight: 800; background: #fee2e2; padding: 2px 6px; border-radius: 6px; font-size: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        @keyframes modalIn { from { opacity: 0; transform: scale(.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1000px) { .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
        @media (max-width: 720px) {
            .page, .header-inner { width: min(100% - 20px, 1500px); }
            .page { padding-top: 22px; } .header-inner { min-height: 66px; }
            .brand-title { font-size: 15px; } .brand-subtitle { display: none; } .brand-icon { width: 40px; height: 40px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; } .stat-card { padding: 15px; } .stat-value { font-size: 22px; }
            .info-grid, .form-grid { grid-template-columns: 1fr; } .form-field.full { grid-column: auto; }
            .order-body { padding: 15px; } .order-header { padding: 15px; }
            .admin-actions { display: grid; grid-template-columns: 1fr 1fr; } .action-btn { width: 100%; }
        }
        @media (max-width: 430px) {
            .stats-grid { grid-template-columns: 1fr; } .toolbar { padding: 12px; }
            .filter-select, .refresh-btn { width: 100%; } .admin-actions { grid-template-columns: 1fr; }
            .order-header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>

<body>

    <header class="admin-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
                <div>
                    <div class="brand-title">NEXT LEVEL SUBS</div>
                    <div class="brand-subtitle">Administrator Order Management</div>
                </div>
            </div>
            <div class="header-actions">
                <a href="dashboard.html" class="header-btn" title="Dashboard"><i class="fas fa-house"></i></a>
                <button type="button" id="refreshTopButton" class="header-btn" title="Refresh"><i class="fas fa-rotate"></i></button>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="page-title">
            <h1>Orders</h1>
            <p>Manage customer payments, subscriptions and account delivery.</p>
        </div>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-cart-shopping"></i></div>
                <div class="stat-label">Total Orders</div>
                <div id="statTotal" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon yellow"><i class="fas fa-clock"></i></div>
                <div class="stat-label">Pending Payments</div>
                <div id="statPending" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-circle-check"></i></div>
                <div class="stat-label">Paid Orders</div>
                <div id="statPaid" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-bangladeshi-taka-sign"></i></div>
                <div class="stat-label">Paid Revenue</div>
                <div id="statRevenue" class="stat-value">৳0</div>
            </div>
        </section>

        <section class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input id="searchInput" type="search" placeholder="Search order, customer, email, phone or product..." autocomplete="off">
            </div>
            <select id="subscriptionFilter" class="filter-select">
                <option value="all">All Subscriptions</option>
                <option value="active">Active Subscriptions</option>
                <option value="expired">Expired Subscriptions</option>
            </select>
            <select id="statusFilter" class="filter-select">
                <option value="all">All Payment Status</option>
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="failed">Failed</option>
                <option value="cancelled">Cancelled</option>
                <option value="refunded">Refunded</option>
            </select>
            <button type="button" id="refreshButton" class="refresh-btn">
                <i class="fas fa-rotate"></i> Refresh
            </button>
        </section>

        <section id="ordersContainer">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </section>
    </main>

    <!-- DELIVERY COMPONENT MODAL -->
    <div id="componentModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Manage Delivery Component</div>
                <button type="button" id="closeModal" class="modal-close"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalComponentId">
                <input type="hidden" id="modalOrderItemId">
                <input type="hidden" id="modalOrderId">
                <input type="hidden" id="modalComponentName">
                <input type="hidden" id="modalComponentSlug">
                <input type="hidden" id="modalComponentImage">

                <div class="form-grid">
                    <div class="form-field full">
                        <label>Product</label>
                        <input id="componentProductName" type="text" readonly>
                    </div>

                    <div class="form-field">
                        <label>Service Name</label>
                        <input id="componentServiceName" type="text" placeholder="e.g., Netflix Premium">
                    </div>

                    <div class="form-field">
                        <label>Plan Duration</label>
                        <input id="componentPlanDuration" type="text" placeholder="e.g., 1 Month">
                    </div>

                    <div class="form-field">
                        <label>Quantity</label>
                        <input id="componentQuantity" type="number" min="1" value="1">
                    </div>

                    <div class="form-field">
                        <label>Slot Number</label>
                        <input id="componentSlotNumber" type="number" min="1" value="1">
                    </div>

                    <div class="form-field">
                        <label>Component Price (৳)</label>
                        <input id="componentPrice" type="number" min="0" step="0.01">
                    </div>

                    <div class="form-field">
                        <label>Delivery Status</label>
                        <select id="componentDeliveryStatus">
                            <option value="pending">Pending</option>
                            <option value="delivered">Delivered</option>
                            <option value="failed">Failed</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label>Subscription Start Date</label>
                        <input id="componentStart" type="datetime-local">
                    </div>

                    <div class="form-field">
                        <label>Subscription Expiry Date</label>
                        <input id="componentExpiry" type="datetime-local">
                    </div>

                    <div class="form-field">
                        <label>Subscription Email / Username</label>
                        <input id="componentEmail" type="text" placeholder="customer@example.com">
                    </div>

                    <div class="form-field">
                        <label>Subscription Password</label>
                        <input id="componentPassword" type="text" placeholder="Account password">
                    </div>

                    <div class="form-field full">
                        <label>Delivery Note</label>
                        <textarea id="componentDeliveryNote" placeholder="Account details, profile information, PIN, instructions, etc."></textarea>
                    </div>

                    <div class="form-field full">
                        <label>Admin Note</label>
                        <textarea id="componentAdminNote" placeholder="Internal note..."></textarea>
                    </div>
                </div>

                <div class="delivery-note">
                    <i class="fas fa-circle-info mr-1"></i>
                    This information will be displayed to the customer in their dashboard.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancelModal" class="action-btn btn-secondary">Cancel</button>
                <button type="button" id="saveComponentButton" class="action-btn btn-primary">
                    <i class="fas fa-floppy-disk"></i> Save Component
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
    "use strict";

    /* =========================================================
       STATE
    ========================================================= */
    let allOrders = [];
    let orderItemsMap = {};
    let orderItemComponentsMap = {}; 
    let isLoading = false;

    /* =========================================================
       DOM
    ========================================================= */
    const ordersContainer = document.getElementById("ordersContainer");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const subscriptionFilter = document.getElementById("subscriptionFilter");
    const refreshButton = document.getElementById("refreshButton");
    const refreshTopButton = document.getElementById("refreshTopButton");
    const componentModal = document.getElementById("componentModal");
    const closeModal = document.getElementById("closeModal");
    const cancelModal = document.getElementById("cancelModal");
    const saveComponentButton = document.getElementById("saveComponentButton");

    /* =========================================================
       HELPERS
    ========================================================= */
    function escapeHTML(value) {
        if (value === null || value === undefined) return "";
        return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function money(value) {
        return Number(value || 0).toLocaleString("en-BD", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(value) {
        if (!value) return "—";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "—";
        return date.toLocaleString("en-BD", { dateStyle: "medium", timeStyle: "short" });
    }

    function toDateTimeLocal(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const pad = number => String(number).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    // Helper to check if subscription is expired
    function isSubscriptionExpired(expiryDate) {
        if (!expiryDate) return false;
        const expiry = new Date(expiryDate);
        if (isNaN(expiry.getTime())) return false;
        return expiry < new Date();
    }

    function showToast(message, type = "success") {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        const icon = type === "success" ? "fa-circle-check" : "fa-circle-exclamation";
        toast.innerHTML = `<i class="fas ${icon}"></i><div class="toast-message">${escapeHTML(message)}</div>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = "0";
            toast.style.transform = "translateY(10px)";
            setTimeout(() => toast.remove(), 250);
        }, 3500);
    }

    function getProductCatalog() {
        if (window.NextLevelSubs?.subscriptions) return window.NextLevelSubs.subscriptions;
        if (Array.isArray(window.products)) return window.products;
        if (typeof rawSubscriptions !== "undefined") return rawSubscriptions;
        return [];
    }

    function findProductInCatalog(productName) {
        if (!productName) return null;
        const normalize = val => String(val || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "");
        const targetName = normalize(productName);
        if (!targetName) return null;

        const catalog = getProductCatalog();
        const arr = Array.isArray(catalog) ? catalog : Object.values(catalog);
        return arr.find(p => normalize(p?.name) === targetName) || null;
    }

    /* =========================================================
       AUTH + ADMIN CHECK
    ========================================================= */
    async function verifyAdmin() {
        const { data: authData, error: authError } = await supabaseClient.auth.getUser();
        if (authError || !authData?.user) {
            window.location.href = "login.html";
            return false;
        }

        const { data: profile, error: profileError } = await supabaseClient
            .from("profiles").select("id, full_name, email, role").eq("id", authData.user.id).single();

        if (profileError || !profile) {
            document.body.innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; font-family:system-ui;"><div><h1>Unable to verify administrator</h1><p>Please try logging in again.</p></div></div>`;
            return false;
        }

        if (String(profile.role || "").toLowerCase() !== "admin") {
            document.body.innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; font-family:system-ui;"><div><h1>Access Denied</h1><p>Administrator access is required.</p><a href="dashboard.html" style="display:inline-block; margin-top:15px; padding:11px 18px; background:#2563eb; color:white; border-radius:10px; text-decoration:none; font-weight:700;">Return to Dashboard</a></div></div>`;
            return false;
        }
        return true;
    }

    /* =========================================================
       LOAD ORDERS
    ========================================================= */
    async function loadOrders() {
        if (isLoading) return;
        isLoading = true;
        showSkeleton();

        try {
            const { data: orders, error: ordersError } = await supabaseClient
                .from("orders").select("*").order("created_at", { ascending: false });

            if (ordersError) throw ordersError;
            allOrders = orders || [];
            orderItemsMap = {};
            orderItemComponentsMap = {};

            if (allOrders.length === 0) {
                updateStats();
                renderOrders();
                return;
            }

            const orderIds = allOrders.map(o => o.id).filter(Boolean);

            const { data: orderItems, error: orderItemsError } = await supabaseClient
                .from("order_items").select("*").in("order_id", orderIds);

            if (orderItemsError) throw orderItemsError;

            const safeOrderItems = Array.isArray(orderItems) ? orderItems : [];
            const orderItemIds = safeOrderItems.map(i => i.id).filter(Boolean);

            let components = [];
            if (orderItemIds.length > 0) {
                const { data: compData, error: compError } = await supabaseClient
                    .from("order_item_components")
                    .select("*")
                    .in("order_item_id", orderItemIds)
                    .order("slot_number", { ascending: true });
                
                if (compError) throw compError;
                components = Array.isArray(compData) ? compData : [];
            }

            components.forEach(comp => {
                if (!orderItemComponentsMap[comp.order_item_id]) {
                    orderItemComponentsMap[comp.order_item_id] = [];
                }
                orderItemComponentsMap[comp.order_item_id].push(comp);
            });

            safeOrderItems.forEach(item => {
                if (!orderItemsMap[item.order_id]) orderItemsMap[item.order_id] = [];
                
                const catalogProduct = findProductInCatalog(item.product_name || item.name);
                
                const normalizedItem = {
                    ...item,
                    product_name: item.product_name || item.name || catalogProduct?.name || "Product",
                    product_slug: item.product_slug || catalogProduct?.slug || "",
                    product_image: item.product_image || catalogProduct?.image || "",
                    plan_duration: item.plan_duration || item.duration || catalogProduct?.duration || "Standard",
                    price: item.price ?? item.unit_price ?? 0,
                    quantity: item.quantity ?? 1,
                    components: orderItemComponentsMap[item.id] || []
                };
                orderItemsMap[item.order_id].push(normalizedItem);
            });

            updateStats();
            renderOrders();

        } catch (error) {
            console.error("Load orders error:", error);
            ordersContainer.innerHTML = `<div class="empty-state"><div class="empty-icon"><i class="fas fa-triangle-exclamation"></i></div><h2>Unable to load orders</h2><p style="color:#6b7280; margin-top:7px;">${escapeHTML(error?.message || "Something went wrong.")}</p></div>`;
            showToast(error?.message || "Unable to load orders.", "error");
        } finally {
            isLoading = false;
            if (refreshButton) {
                refreshButton.disabled = false;
                refreshButton.innerHTML = `<i class="fas fa-sync-alt"></i> Refresh`;
            }
        }
    }

    function showSkeleton() {
        ordersContainer.innerHTML = `<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>`;
    }

    /* =========================================================
       STATS & FILTERS
    ========================================================= */
    function updateStats() {
        const total = allOrders.length;
        const pending = allOrders.filter(o => String(o.payment_status || "").toLowerCase() === "pending").length;
        const paidOrders = allOrders.filter(o => String(o.payment_status || "").toLowerCase() === "paid");
        const revenue = paidOrders.reduce((sum, o) => sum + Number(o.total || 0), 0);

        document.getElementById("statTotal").textContent = total;
        document.getElementById("statPending").textContent = pending;
        document.getElementById("statPaid").textContent = paidOrders.length;
        document.getElementById("statRevenue").textContent = `৳${money(revenue)}`;
    }

    function getFilteredOrders() {
        const search = searchInput.value.trim().toLowerCase();
        const status = statusFilter.value;
        const subStatus = subscriptionFilter.value;

        return allOrders.filter(order => {
            if (status !== "all" && order.payment_status !== status) return false;
            
            // Filter by Subscription Active/Expired status
            if (subStatus !== "all") {
                const items = orderItemsMap[order.id] || [];
                let hasMatch = false;
                for (const item of items) {
                    const components = orderItemComponentsMap[item.id] || [];
                    for (const comp of components) {
                        const isExpired = isSubscriptionExpired(comp.subscription_expiry);
                        if (subStatus === "active" && !isExpired) { hasMatch = true; break; }
                        if (subStatus === "expired" && isExpired) { hasMatch = true; break; }
                    }
                    if (hasMatch) break;
                }
                if (!hasMatch) return false;
            }

            if (!search) return true;

            const items = orderItemsMap[order.id] || [];
            const productNames = items.map(i => i.product_name).join(" ");
            const searchable = [order.order_number, order.customer_name, order.email, order.phone, order.payment_method, productNames].filter(Boolean).join(" ").toLowerCase();
            return searchable.includes(search);
        });
    }

    function statusBadge(status) {
        const normalized = String(status || "pending").toLowerCase();
        let icon = "fa-clock";
        if (normalized === "paid") icon = "fa-circle-check";
        else if (normalized === "failed") icon = "fa-circle-xmark";
        else if (normalized === "cancelled") icon = "fa-ban";
        else if (normalized === "refunded") icon = "fa-rotate-left";

        return `<span class="status-badge status-${escapeHTML(normalized)}"><i class="fas ${icon}"></i>${escapeHTML(normalized.charAt(0).toUpperCase() + normalized.slice(1))}</span>`;
    }

    /* =========================================================
       PAYMENT ACTIONS
    ========================================================= */
    async function approvePayment(orderId) {
        const order = allOrders.find(o => o.id === orderId);
        if (!order) return;
        if (!window.confirm(`Approve payment for ${order.order_number || order.id}?`)) return;

        try {
            const { error } = await supabaseClient.from("orders").update({
                payment_status: "paid",
                admin_note: "Payment approved by administrator."
            }).eq("id", orderId);

            if (error) throw error;
            showToast("Payment approved successfully.");
            await loadOrders();
        } catch (error) {
            console.error("Approve payment error:", error);
            showToast(error?.message || "Unable to approve payment.", "error");
        }
    }

    async function rejectPayment(orderId) {
        const reason = window.prompt("Enter a rejection reason (optional):");
        if (reason === null) return;

        try {
            const { error } = await supabaseClient.from("orders").update({
                payment_status: "failed",
                admin_note: reason.trim() || "Payment rejected by administrator."
            }).eq("id", orderId);

            if (error) throw error;
            showToast("Payment marked as failed.");
            await loadOrders();
        } catch (error) {
            console.error("Reject payment error:", error);
            showToast(error?.message || "Unable to reject payment.", "error");
        }
    }

    /* =========================================================
       COMPONENT MODAL ACTIONS (Strict DB mapping)
    ========================================================= */
    window.openComponentModal = function(orderId, orderItemId, componentId) {
        if (!orderId && orderItemId) {
            for (const oid in orderItemsMap) {
                if (orderItemsMap[oid].some(i => i.id === orderItemId)) {
                    orderId = oid;
                    break;
                }
            }
        }

        const order = allOrders.find(o => o.id === orderId);
        const item = orderItemsMap[orderId]?.find(i => i.id === orderItemId);

        if (!order || !item) {
            showToast("Order item not found.", "error");
            return;
        }

        if (order.payment_status !== "paid") {
            showToast("Approve the payment before adding delivery components.", "error");
            return;
        }

        let component = null;
        if (componentId) {
            component = orderItemComponentsMap[orderItemId]?.find(c => c.id === componentId);
            if (!component) {
                showToast("Component not found.", "error");
                return;
            }
        }

        document.getElementById("modalComponentId").value = componentId || "";
        document.getElementById("modalOrderItemId").value = orderItemId || "";
        document.getElementById("modalOrderId").value = orderId || "";
        
        // Capture catalog information to save exactly to your DB columns
        document.getElementById("modalComponentName").value = item.product_name || "";
        document.getElementById("modalComponentSlug").value = item.product_slug || "";
        document.getElementById("modalComponentImage").value = item.product_image || "";
        
        document.getElementById("componentProductName").value = item.product_name || "Product";
        document.getElementById("componentServiceName").value = component?.service_name || item.product_name || "";
        document.getElementById("componentPlanDuration").value = component?.plan_duration || item.plan_duration || "";
        document.getElementById("componentQuantity").value = component?.quantity || 1;
        document.getElementById("componentSlotNumber").value = component?.slot_number || (orderItemComponentsMap[orderItemId]?.length || 0) + 1;
        document.getElementById("componentPrice").value = component?.component_price || item.price || 0;
        document.getElementById("componentDeliveryStatus").value = component?.delivery_status || "pending";
        
        document.getElementById("componentStart").value = toDateTimeLocal(component?.subscription_start || new Date().toISOString());
        document.getElementById("componentExpiry").value = toDateTimeLocal(component?.subscription_expiry || "");
        
        document.getElementById("componentEmail").value = component?.subscription_email || "";
        document.getElementById("componentPassword").value = component?.subscription_password || "";
        document.getElementById("componentDeliveryNote").value = component?.delivery_note || "";
        document.getElementById("componentAdminNote").value = component?.admin_note || "";

        componentModal.classList.add("show");
        document.body.style.overflow = "hidden";
    };

    function closeComponentModal() {
        componentModal.classList.remove("show");
        document.body.style.overflow = "";
    }

    async function saveComponent() {
        const componentId = document.getElementById("modalComponentId").value;
        const orderItemId = document.getElementById("modalOrderItemId").value;

        if (!orderItemId) {
            showToast("Order Item ID is missing.", "error");
            return;
        }

        // STRICT MAPPING TO YOUR EXACT DATABASE SCHEMA
        const payload = {
            order_item_id: orderItemId,
            component_name: document.getElementById("modalComponentName").value || null,
            component_slug: document.getElementById("modalComponentSlug").value || null,
            component_image: document.getElementById("modalComponentImage").value || null,
            custom_name: document.getElementById("componentServiceName").value.trim() || null,
            service_name: document.getElementById("componentServiceName").value.trim() || null,
            plan_duration: document.getElementById("componentPlanDuration").value.trim() || null,
            quantity: Number(document.getElementById("componentQuantity").value || 1),
            slot_number: Number(document.getElementById("componentSlotNumber").value || 1),
            component_price: Number(document.getElementById("componentPrice").value || 0),
            delivery_status: document.getElementById("componentDeliveryStatus").value,
            subscription_start: document.getElementById("componentStart").value ? new Date(document.getElementById("componentStart").value).toISOString() : null,
            subscription_expiry: document.getElementById("componentExpiry").value ? new Date(document.getElementById("componentExpiry").value).toISOString() : null,
            subscription_email: document.getElementById("componentEmail").value.trim() || null,
            subscription_password: document.getElementById("componentPassword").value.trim() || null,
            delivery_note: document.getElementById("componentDeliveryNote").value.trim() || null,
            admin_note: document.getElementById("componentAdminNote").value.trim() || null,
        };

        const confirmed = window.confirm("Save this delivery component?");
        if (!confirmed) return;

        const originalHTML = saveComponentButton.innerHTML;
        saveComponentButton.disabled = true;
        saveComponentButton.innerHTML = `<i class="fas fa-spinner spin"></i> Saving...`;

        try {
            let savedData = null;
            
            if (componentId) {
                const { data, error } = await supabaseClient
                    .from("order_item_components")
                    .update(payload)
                    .eq("id", componentId)
                    .select()
                    .single();
                    
                if (error) throw error;
                savedData = data;
            } else {
                const { data, error } = await supabaseClient
                    .from("order_item_components")
                    .insert(payload)
                    .select()
                    .single();
                    
                if (error) throw error;
                savedData = data;
            }

            if (!orderItemComponentsMap[orderItemId]) {
                orderItemComponentsMap[orderItemId] = [];
            }
            
            if (componentId) {
                const index = orderItemComponentsMap[orderItemId].findIndex(c => c.id === componentId);
                if (index !== -1) orderItemComponentsMap[orderItemId][index] = savedData;
            } else {
                orderItemComponentsMap[orderItemId].push(savedData);
                orderItemComponentsMap[orderItemId].sort((a, b) => Number(a.slot_number || 0) - Number(b.slot_number || 0));
            }

            showToast("Delivery component saved successfully.");
            closeComponentModal();
            
            const listElement = document.getElementById(`componentsList-${orderItemId}`);
            if (listElement) {
                listElement.innerHTML = renderComponentsList(orderItemId);
            }

        } catch (error) {
            console.error("Save component error:", error);
            showToast(error?.message || "Unable to save component.", "error");
        } finally {
            saveComponentButton.disabled = false;
            saveComponentButton.innerHTML = originalHTML;
        }
    }

    closeModal.addEventListener("click", closeComponentModal);
    cancelModal.addEventListener("click", closeComponentModal);
    saveComponentButton.addEventListener("click", saveComponent);
    
    componentModal.addEventListener("click", event => {
        if (event.target === componentModal) closeComponentModal();
    });
    
    document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeComponentModal();
    });

    async function initAdminOrders() {
        try {
            const isAdmin = await verifyAdmin();
            if (!isAdmin) return;
            await loadOrders();
        } catch (error) {
            console.error("Initialization error:", error);
        }
    }

    initAdminOrders();
    </script>
</body>
</html>
