<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h2 {
            margin: 0 0 12px;
            color: #222;
        }

        p {
            margin: 0;
            color: #666;
            line-height: 1.5;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #d93025;
        }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 20px;
            border: 3px solid #e5e5e5;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div id="spinner" class="spinner"></div>

        <h2 id="status-message">
            Verifying your email...
        </h2>

        <p id="status-description">
            Please wait a moment.
        </p>

    </div>


    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        /* =========================================================
           SUPABASE CONFIGURATION
        ========================================================= */

        const SUPABASE_URL =
            'https://zrptkmjdltqdjzrpogyo.supabase.co';

        const SUPABASE_ANON_KEY =
            'sb_publishable_KcWSkkO1L4z0U6UUfZijyw_KIJ_d5m7';


        /* =========================================================
           WEBSITE CONFIGURATION
        ========================================================= */

        const WEBSITE_URL =
            'https://www.nextlevelsubs.com/';


        /* =========================================================
           INITIALIZE SUPABASE
        ========================================================= */

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth: {
                    detectSessionInUrl: true,
                    persistSession: true,
                    autoRefreshToken: true
                }
            }
        );


        /* =========================================================
           DOM ELEMENTS
        ========================================================= */

        const messageEl =
            document.getElementById('status-message');

        const descriptionEl =
            document.getElementById('status-description');

        const spinnerEl =
            document.getElementById('spinner');


        /* =========================================================
           CLEAN URL HASH
           
           Supabase email verification can return authentication
           information inside the URL hash.

           Example:
           #access_token=xxxxx&type=signup

           We remove that hash from the browser URL after Supabase
           has processed it.
        ========================================================= */

        function cleanCurrentUrl() {

            try {

                const cleanUrl =
                    window.location.origin +
                    window.location.pathname +
                    window.location.search;

                window.history.replaceState(
                    null,
                    document.title,
                    cleanUrl
                );

            } catch (error) {

                console.warn(
                    'Could not clean verification URL:',
                    error
                );
            }
        }


        /* =========================================================
           REDIRECT TO WEBSITE
        ========================================================= */

        function redirectToWebsite() {

            /*
             * Remove Supabase authentication hash first.
             */
            cleanCurrentUrl();

            /*
             * Use replace() instead of href so the user does not
             * return to the verification page when pressing Back.
             */
            window.location.replace(WEBSITE_URL);
        }


        /* =========================================================
           VERIFY USER
        ========================================================= */

        async function verifyUser() {

            try {

                /*
                 * Give Supabase time to process the authentication
                 * information contained in the URL.
                 */
                await new Promise(resolve => {
                    setTimeout(resolve, 1000);
                });


                /*
                 * Get the current authenticated session.
                 */
                const {
                    data,
                    error
                } = await supabaseClient.auth.getSession();


                /*
                 * Handle Supabase errors.
                 */
                if (error) {
                    throw error;
                }


                const session = data?.session;


                /* =================================================
                   SUCCESS
                ================================================= */

                if (session) {

                    spinnerEl.style.display = 'none';

                    messageEl.textContent =
                        'Email verified successfully!';

                    messageEl.classList.add('success');

                    descriptionEl.textContent =
                        'Redirecting you to Next Level Subs...';


                    /*
                     * Clean the URL immediately.
                     */
                    cleanCurrentUrl();


                    /*
                     * Redirect after a short delay.
                     */
                    setTimeout(() => {

                        redirectToWebsite();

                    }, 1200);


                    return;
                }


                /* =================================================
                   NO SESSION
                ================================================= */

                spinnerEl.style.display = 'none';

                messageEl.textContent =
                    'Verification failed or link expired.';

                messageEl.classList.add('error');

                descriptionEl.textContent =
                    'Please request a new verification email and try again.';


                /*
                 * Remove any Supabase token/hash from the URL.
                 */
                cleanCurrentUrl();


            } catch (error) {

                console.error(
                    'Email verification error:',
                    error
                );


                spinnerEl.style.display = 'none';

                messageEl.textContent =
                    'Verification failed.';

                messageEl.classList.add('error');

                descriptionEl.textContent =
                    'The verification link may have expired. Please request a new one.';


                /*
                 * Clean the URL even when verification fails.
                 */
                cleanCurrentUrl();
            }
        }


        /* =========================================================
           START VERIFICATION
        ========================================================= */

        verifyUser();

    </script>

</body>
</html>
