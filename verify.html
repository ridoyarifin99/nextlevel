<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="status-message">Verifying your email...</h2>
        <p>Please wait a moment.</p>
    </div>

    <!-- Include Supabase JS SDK via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://zrptkmjdltqdjzrpogyo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KcWSkkO1L4z0U6UUfZijyw_KIJ_d5m7';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleVerification() {
            const messageEl = document.getElementById('status-message');
            
            // Helper function to extract parameters from search (?) OR hash (#)
            const getParam = (name) => {
                const searchParams = new URLSearchParams(window.location.search);
                if (searchParams.has(name)) return searchParams.get(name);
                
                // Strip the '#' symbol and parse hash parameters
                const hashString = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
                const hashParams = new URLSearchParams(hashString);
                return hashParams.get(name);
            };

            const tokenHash = getParam('token_hash');
            const type = getParam('type') || 'email';
            const code = getParam('code');
            const accessToken = getParam('access_token');

            // If Supabase automatically logs them in via the hash fragment tokens
            if (accessToken || tokenHash || code) {
                let error = null;

                if (tokenHash) {
                    const res = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: type });
                    error = res.error;
                } else if (code) {
                    const res = await supabase.auth.exchangeCodeForSession(code);
                    error = res.error;
                }

                // Check active session as a fallback if tokens were processed natively by Supabase client
                const { data: { session } } = await supabase.auth.getSession();

                if (error && !session) {
                    messageEl.textContent = 'Verification failed or link expired. Please try again.';
                } else {
                    messageEl.textContent = 'Email verified successfully! Redirecting to nextlevelsubs.com...';
                    
                    setTimeout(() => {
                        window.location.href = 'https://www.nextlevelsubs.com';
                    }, 2500);
                }
            } else {
                // Check if they are already logged in
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    messageEl.textContent = 'Email already verified! Redirecting...';
                    setTimeout(() => { 
                        window.location.href = 'https://www.nextlevelsubs.com'; 
                    }, 2000);
                } else {
                    messageEl.textContent = 'Invalid or missing verification tokens.';
                }
            }
        }

        handleVerification();
    </script>
</body>
</html>
