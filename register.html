<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Next Level Subs</title>

    <meta
        name="description"
        content="Create your Next Level Subs customer account."
    >

    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./src/all.min.css">

    <style>
        body {
            background: #f8fafc;
        }

        .auth-card {
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-strength {
            height: 4px;
            border-radius: 999px;
            overflow: hidden;
            background: #e5e7eb;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
         HEADER
         ============================================================ -->

    <header class="bg-white shadow-md sticky top-0 z-50">

        <div class="container mx-auto px-4 py-3">

            <div class="flex items-center justify-between">

                <!-- Logo -->

                <a
                    href="index.html"
                    class="flex items-center space-x-2"
                >

                    <img
                        src="/images/next_level.png"
                        alt="Next Level Subs Logo"
                        class="logo-image"
                    >

                    <div class="logo-text-container">

                        <div
                            class="logo-text-item"
                            style="color: var(--primary-color); font-size: 1rem;"
                        >
                            Trusted
                        </div>

                        <div
                            class="logo-text-item"
                            style="color: var(--primary-color); font-size: 1rem;"
                        >
                            Cheap
                        </div>

                        <div
                            class="logo-text-item"
                            style="color: var(--primary-color); font-size: 1rem;"
                        >
                            Secure
                        </div>

                        <div
                            class="logo-text-item"
                            style="color: var(--primary-color); font-size: 1rem;"
                        >
                            24/7 Support
                        </div>

                    </div>

                </a>


                <!-- Back -->

                <a
                    href="index.html"
                    class="text-gray-600 hover:text-blue-500 transition-colors"
                >
                    <i class="fas fa-arrow-left mr-2"></i>
                    Home
                </a>

            </div>

        </div>

    </header>


    <!-- ============================================================
         REGISTER SECTION
         ============================================================ -->

    <main class="min-h-screen py-12 px-4">

        <div class="max-w-md mx-auto">

            <!-- Card -->

            <div
                class="auth-card bg-white rounded-2xl shadow-xl p-6 sm:p-8"
            >

                <!-- Icon -->

                <div class="flex justify-center mb-5">

                    <div
                        class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center"
                    >

                        <i
                            class="fas fa-user-plus text-2xl text-blue-500"
                        ></i>

                    </div>

                </div>


                <!-- Heading -->

                <div class="text-center mb-7">

                    <h1 class="text-3xl font-bold text-gray-900">
                        Create Account
                    </h1>

                    <p class="text-gray-500 mt-2">
                        Create your Next Level Subs account
                    </p>

                </div>


                <!-- Error -->

                <div
                    id="errorMessage"
                    class="hidden mb-5 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"
                >

                    <div class="flex items-start">

                        <i class="fas fa-circle-exclamation mt-0.5 mr-2"></i>

                        <span id="errorText"></span>

                    </div>

                </div>


                <!-- Success -->

                <div
                    id="successMessage"
                    class="hidden mb-5 p-4 rounded-lg bg-green-50 border border-green-200 text-green-700 text-sm"
                >

                    <div class="flex items-start">

                        <i class="fas fa-circle-check mt-0.5 mr-2"></i>

                        <span id="successText"></span>

                    </div>

                </div>


                <!-- Register Form -->

                <form id="registerForm">

                    <!-- Full Name -->

                    <div class="mb-5">

                        <label
                            for="fullName"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Full Name
                        </label>

                        <div class="relative">

                            <i
                                class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                            ></i>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                                placeholder="Your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="mb-5">

                        <label
                            for="email"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Email Address
                        </label>

                        <div class="relative">

                            <i
                                class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                            ></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                                placeholder="you@example.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="mb-5">

                        <label
                            for="phone"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Phone Number
                        </label>

                        <div class="relative">

                            <i
                                class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                            ></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                                placeholder="+880 1XXX XXXXXX"
                                autocomplete="tel"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="mb-2">

                        <label
                            for="password"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <i
                                class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                            ></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="w-full pl-11 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                aria-label="Show password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Password Strength -->

                    <div class="mb-5">

                        <div class="password-strength">

                            <div
                                id="passwordStrengthBar"
                                class="password-strength-bar"
                            ></div>

                        </div>

                        <p
                            id="passwordStrengthText"
                            class="text-xs text-gray-500 mt-2"
                        >
                            Use at least 6 characters.
                        </p>

                    </div>


                    <!-- Confirm Password -->

                    <div class="mb-6">

                        <label
                            for="confirmPassword"
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Confirm Password
                        </label>

                        <div class="relative">

                            <i
                                class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
                            ></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="w-full pl-11 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                aria-label="Show password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Terms -->

                    <div class="mb-6">

                        <label class="flex items-start">

                            <input
                                type="checkbox"
                                id="terms"
                                class="mt-1 mr-3"
                                required
                            >

                            <span class="text-sm text-gray-600">

                                I agree to the
                                <a
                                    href="#"
                                    class="text-blue-500 hover:underline"
                                >
                                    Terms & Conditions
                                </a>
                                and
                                <a
                                    href="#"
                                    class="text-blue-500 hover:underline"
                                >
                                    Privacy Policy
                                </a>.

                            </span>

                        </label>

                    </div>


                    <!-- Register Button -->

                    <button
                        type="submit"
                        id="registerButton"
                        class="w-full py-3 px-4 rounded-lg font-semibold text-white bg-blue-500 hover:bg-blue-600 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
                    >

                        <span id="registerButtonText">

                            <i class="fas fa-user-plus mr-2"></i>
                            Create Account

                        </span>

                    </button>

                </form>


                <!-- Login -->

                <div class="text-center mt-6">

                    <p class="text-gray-600 text-sm">

                        Already have an account?

                        <a
                            href="login.html"
                            class="text-blue-500 font-semibold hover:underline"
                        >
                            Login
                        </a>

                    </p>

                </div>

            </div>


            <!-- Security -->

            <div class="text-center mt-5 text-sm text-gray-500">

                <i class="fas fa-shield-halved mr-1"></i>

                Your account information is securely protected.

            </div>

        </div>

    </main>


    <!-- ============================================================
         SUPABASE
         ============================================================ -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/supabase-config.js"></script>


    <!-- ============================================================
         REGISTER LOGIC
         ============================================================ -->

    <script>

        "use strict";


        // ========================================================
        // DOM ELEMENTS
        // ========================================================

        const registerForm =
            document.getElementById("registerForm");

        const fullNameInput =
            document.getElementById("fullName");

        const emailInput =
            document.getElementById("email");

        const phoneInput =
            document.getElementById("phone");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const termsInput =
            document.getElementById("terms");

        const registerButton =
            document.getElementById("registerButton");

        const registerButtonText =
            document.getElementById("registerButtonText");

        const errorMessage =
            document.getElementById("errorMessage");

        const errorText =
            document.getElementById("errorText");

        const successMessage =
            document.getElementById("successMessage");

        const successText =
            document.getElementById("successText");

        const passwordStrengthBar =
            document.getElementById("passwordStrengthBar");

        const passwordStrengthText =
            document.getElementById("passwordStrengthText");


        // ========================================================
        // SHOW ERROR
        // ========================================================

        function showError(message) {

            errorText.textContent = message;

            errorMessage.classList.remove("hidden");

            successMessage.classList.add("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        // ========================================================
        // SHOW SUCCESS
        // ========================================================

        function showSuccess(message) {

            successText.textContent = message;

            successMessage.classList.remove("hidden");

            errorMessage.classList.add("hidden");

        }


        // ========================================================
        // HIDE MESSAGES
        // ========================================================

        function hideMessages() {

            errorMessage.classList.add("hidden");

            successMessage.classList.add("hidden");

        }


        // ========================================================
        // PASSWORD VISIBILITY
        // ========================================================

        function setupPasswordToggle(buttonId, inputId) {

            const button =
                document.getElementById(buttonId);

            const input =
                document.getElementById(inputId);

            button.addEventListener("click", function () {

                const isPassword =
                    input.type === "password";

                input.type =
                    isPassword ? "text" : "password";

                const icon =
                    button.querySelector("i");

                icon.classList.toggle(
                    "fa-eye",
                    !isPassword
                );

                icon.classList.toggle(
                    "fa-eye-slash",
                    isPassword
                );

            });

        }


        setupPasswordToggle(
            "togglePassword",
            "password"
        );

        setupPasswordToggle(
            "toggleConfirmPassword",
            "confirmPassword"
        );


        // ========================================================
        // PASSWORD STRENGTH
        // ========================================================

        passwordInput.addEventListener(
            "input",
            function () {

                const password =
                    passwordInput.value;

                let strength = 0;

                if (password.length >= 6) {
                    strength += 25;
                }

                if (password.length >= 10) {
                    strength += 25;
                }

                if (/[A-Z]/.test(password)) {
                    strength += 15;
                }

                if (/[0-9]/.test(password)) {
                    strength += 15;
                }

                if (/[^A-Za-z0-9]/.test(password)) {
                    strength += 20;
                }

                passwordStrengthBar.style.width =
                    strength + "%";


                if (!password) {

                    passwordStrengthText.textContent =
                        "Use at least 6 characters.";

                }

                else if (strength < 50) {

                    passwordStrengthText.textContent =
                        "Weak password.";

                }

                else if (strength < 75) {

                    passwordStrengthText.textContent =
                        "Good password.";

                }

                else {

                    passwordStrengthText.textContent =
                        "Strong password.";

                }

            }
        );


        // ========================================================
        // REGISTER
        // ========================================================

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                hideMessages();


                const fullName =
                    fullNameInput.value.trim();

                const email =
                    emailInput.value.trim().toLowerCase();

                const phone =
                    phoneInput.value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                // ------------------------------------------------
                // VALIDATION
                // ------------------------------------------------

                if (!fullName) {

                    showError(
                        "Please enter your full name."
                    );

                    return;
                }


                if (!email) {

                    showError(
                        "Please enter your email address."
                    );

                    return;
                }


                if (!phone) {

                    showError(
                        "Please enter your phone number."
                    );

                    return;
                }


                if (password.length < 6) {

                    showError(
                        "Password must contain at least 6 characters."
                    );

                    return;
                }


                if (password !== confirmPassword) {

                    showError(
                        "Passwords do not match."
                    );

                    return;
                }


                if (!termsInput.checked) {

                    showError(
                        "Please accept the Terms & Conditions and Privacy Policy."
                    );

                    return;
                }


                // ------------------------------------------------
                // LOADING
                // ------------------------------------------------

                registerButton.disabled = true;

                registerButtonText.innerHTML =
                    '<div class="spinner"></div>';


                try {

                    // ------------------------------------------------
                    // SUPABASE SIGN UP
                    // ------------------------------------------------

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                full_name: fullName,

                                phone: phone

                            }

                        }

                    });


                    if (error) {

                        console.error(
                            "Supabase registration error:",
                            error
                        );

                        throw error;

                    }


                    // ------------------------------------------------
                    // SUCCESS
                    // ------------------------------------------------

                    console.log(
                        "Registration successful:",
                        data
                    );


                    /*
                     * Supabase may require email confirmation
                     * depending on your Authentication settings.
                     */

                    if (
                        data.user &&
                        data.user.identities &&
                        data.user.identities.length === 0
                    ) {

                        throw new Error(
                            "An account with this email may already exist."
                        );

                    }


                    showSuccess(
                        "Your account has been created successfully."
                    );


                    // Clear form

                    registerForm.reset();

                    passwordStrengthBar.style.width = "0%";

                    passwordStrengthText.textContent =
                        "Use at least 6 characters.";


                    // ------------------------------------------------
                    // REDIRECT
                    // ------------------------------------------------

                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        1500
                    );


                }

                catch (error) {

                    console.error(error);


                    let message =
                        "Unable to create your account. Please try again.";


                    if (error.message) {

                        message =
                            error.message;

                    }


                    // Friendly Supabase messages

                    if (
                        message.toLowerCase().includes(
                            "user already registered"
                        )
                    ) {

                        message =
                            "An account with this email already exists. Please log in instead.";

                    }


                    if (
                        message.toLowerCase().includes(
                            "password should be at least"
                        )
                    ) {

                        message =
                            "Your password is too short.";

                    }


                    if (
                        message.toLowerCase().includes(
                            "invalid email"
                        )
                    ) {

                        message =
                            "Please enter a valid email address.";

                    }


                    showError(message);

                }


                finally {

                    registerButton.disabled = false;

                    registerButtonText.innerHTML =
                        '<i class="fas fa-user-plus mr-2"></i>Create Account';

                }

            }
        );

    </script>

</body>
</html>
