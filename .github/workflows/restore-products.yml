name: Restore products.js

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore historical products.js
        run: |
          git show 0e44199cfee5f6020c08a67322ef2689489ef371:js/products.js > js/products.js
          git add js/products.js
          git rm .github/workflows/restore-products.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Restore products.js"
          git push origin HEAD:main
