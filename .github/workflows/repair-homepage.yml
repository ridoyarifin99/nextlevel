name: Repair homepage
on:
  workflow_dispatch:
  push:
    branches: [repair-homepage]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair-homepage
      - name: Restore original homepage and fix raw scope
        shell: bash
        run: |
          git fetch origin 6b97e148fb346b99f825446158b2684f700652e0
          git checkout 6b97e148fb346b99f825446158b2684f700652e0 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('const subs=raw.map(enrich);','const subs=(window.raw || []).map(enrich);',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restore original homepage and fix product catalog scope" || exit 0
          git push origin repair-homepage
