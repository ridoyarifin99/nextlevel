name: One-time homepage filter fix
on:
  push:
    paths:
      - '.github/workflows/fix-homepage-filter.yml'
      - 'js/index-ui-central.js'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch filter initialization and cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('js/index-ui-central.js')
          s = p.read_text()
          s = s.replace('let cart=[],searchTimer=null,filterTimer=null;', 'let cart=[],searchTimer=null,filterTimer=null,filterInitialized=false;', 1)
          pattern = r'function syncFilters\(\)\{.*?\}\n  function setupFilters'
          replacement = '''function syncFilters(){if(!minP||!maxP)return;const all=products(),max=Math.max(0,...all.map(price));const currentMax=Number(maxP.value);if(!filterInitialized||!Number.isFinite(currentMax)||currentMax<=0)maxP.value=max;else if(currentMax>max)maxP.value=max;if(Number(minP.value)>max)minP.value=0;minP.min=0;maxP.min=0;minP.max=max;maxP.max=max;if(Number(minP.value)>Number(maxP.value))minP.value=maxP.value;if(Number(maxP.value)<Number(minP.value))minP.value=minP.value;if(minPV)minPV.textContent=`৳${Number(minP.value||0).toLocaleString("en-BD")}`;if(maxPV)maxPV.textContent=`৳${Number(maxP.value||max).toLocaleString("en-BD")}`;filterInitialized=true;applyFilters();}
  function setupFilters'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected syncFilters block, replacements={n}')
          p.write_text(s2)
          h = Path('index.html')
          hs = h.read_text().replace('/js/index-ui-central.js?v=20260912-1', '/js/index-ui-central.js?v=20260912-2')
          h.write_text(hs)
          PY
          git diff --check
          git add js/index-ui-central.js index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: initialize homepage price filter after central catalog loads'
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-homepage-filter.yml
          git add -u .github/workflows/fix-homepage-filter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time homepage filter workflow' || true
          git push || true
