name: Restore Cart Animation Push
on:
  push:
    paths:
      - '.github/workflows/restore-cart-animation-push.yml'
      - 'js/add-to-cart-animation.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore loader and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/supabase-config.js')
          s=p.read_text()
          old="  load('script[data-nextlevel-central-catalog]','/js/central-catalog.js?v=20260912-7','nextlevelCentralCatalog');"
          new=old+"\n  load('script[data-nextlevel-add-to-cart-animation]','/js/add-to-cart-animation.js?v=20260912-1','nextlevelAddToCartAnimation');"
          if "data-nextlevel-add-to-cart-animation" not in s:
              if old not in s: raise SystemExit('central catalog loader not found')
              p.write_text(s.replace(old,new,1))
          for f in ['.github/workflows/restore-cart-animation.yml','.github/workflows/restore-cart-animation-push.yml']:
              Path(f).unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/supabase-config.js .github/workflows/restore-cart-animation.yml .github/workflows/restore-cart-animation-push.yml
          git commit -m "fix: restore add to cart animation"
          git push
