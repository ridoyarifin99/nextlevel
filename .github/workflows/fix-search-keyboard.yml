name: Fix search keyboard dropdown
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch
        run: |
          git checkout 8e66e5688d199b0b99448279664cadb1f6a2ffdc -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pattern=r"\s*if \(sDrop\.classList\.contains\('active'\)\) \{ sDrop\.classList\.remove\('active'\); sInp\.blur\(\); mInp\.blur\(\); \}\s*if \(mPan\.classList\.contains\('active'\)\) \{ mPan\.classList\.remove\('active'\); \}"
          s,n=re.subn(pattern,"\n          /* Keep search open while the mobile keyboard changes the viewport. */",s,count=1)
          if n!=1: raise SystemExit('Search scroll-close block not found')
          old="setTimeout(() => mInp.focus(), 100);"
          if old not in s: raise SystemExit('Mobile focus block not found')
          s=s.replace(old,"setTimeout(() => mInp.focus({preventScroll:true}), 50);",1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-search-keyboard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-search-keyboard.yml
          git commit -m 'Fix mobile search dropdown keyboard behavior'
          git push
