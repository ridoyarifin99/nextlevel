name: Fix product card AOS animation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[card-animation-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove animation-breaking overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/auth.js')
          s = p.read_text(encoding='utf-8')

          timer = '''  var nativeSetTimeout=W.setTimeout;
          W.setTimeout=function(fn,delay){
            var args=[].slice.call(arguments,2);
            if(delay===1500)delay=0;
            return nativeSetTimeout.apply(W,[fn,delay].concat(args));
          };
          '''
          if timer in s:
              s = s.replace(timer, '', 1)
              print('Removed global 1500ms setTimeout interception.')
          else:
              print('Global timer interception already absent.')

          pattern = r"\.subscription-card\[data-aos\]\{.*?\}\.subscription-card\[data-aos\]:nth-child\(8\)\{.*?\}@keyframes nlsProductEnter\{.*?\}"
          s2, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n:
              s = s2
              print('Removed mobile AOS override that forced cards to use a separate animation.')
          else:
              print('Mobile AOS override already absent.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/auth.js
          git rm .github/workflows/fix-card-animation.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix product card AOS animation [card-animation-fix]'
          git push
