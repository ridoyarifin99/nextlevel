name: Repair Vercel and AOS now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('src/auth.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'  var nativeSetTimeout=W\\.setTimeout;\\n  W\\.setTimeout=function\\(fn,delay\\)\\{\\n    var args=\\[\\]\\.slice\\.call\\(arguments,2\\);\\n    if\\(delay===1500\\)delay=0;\\n    return nativeSetTimeout\\.apply\\(W,\\[fn,delay\\]\\.concat\\(args\\)\\);\\n  \\};\\n', '', s, count=1)
          s = s.replace('to{opacity:1;transform:translate3d(0,0,0)}}}', '', 1)
          s = re.sub(r'\\.subscription-card\\[data-aos\\]\\{.*?@keyframes nlsProductEnter\\{.*?\\}\\}', '', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          v = Path('vercel.json')
          data = json.loads(v.read_text(encoding='utf-8'))
          fn = data.get('functions', {}).get('api/home.js')
          if isinstance(fn, dict) and isinstance(fn.get('includeFiles'), list):
              fn['includeFiles'] = fn['includeFiles'][0] if fn['includeFiles'] else 'index.html'
          v.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/auth.js vercel.json
          git rm -f .github/workflows/repair-now.yml .github/workflows/repair-vercel-and-aos.yml || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Repair Vercel config and AOS animation'
          git push
