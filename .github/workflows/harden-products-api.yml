name: Harden products API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix: harden products API against category join timeouts')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nested category join from products query
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          p = Path('api/products.js')
          s = p.read_text()
          old = '"id,category_id,name,slug,description,image_url,icon,brand_color,currency,price,old_price,is_available,display_order,is_featured,badge,features,faq,keywords,seo_title,seo_description,seo_canonical,services,extra_data,is_archived,product_categories(id,name,slug)"'
          new = '"id,category_id,name,slug,description,image_url,icon,brand_color,currency,price,old_price,is_available,display_order,is_featured,badge,features,faq,keywords,seo_title,seo_description,seo_canonical,services,extra_data,is_archived"'
          if old not in s:
              raise SystemExit('products select string not found')
          s = s.replace(old, new, 1)
          old2 = 'const [products, plans, media] = await Promise.all(['
          new2 = 'const [products, plans, media, categories] = await Promise.all(['
          if old2 not in s:
              raise SystemExit('promise declaration not found')
          s = s.replace(old2, new2, 1)
          old3 = '      query(\n        "product_media",\n        "id,product_id,role,url,storage_path,alt_text,title,service_name,display_order,is_active,metadata"\n      ),'
          new3 = '      query(\n        "product_media",\n        "id,product_id,role,url,storage_path,alt_text,title,service_name,display_order,is_active,metadata"\n      ),\n      query(\n        "product_categories",\n        "id,name,slug"\n      ),'
          if old3 not in s:
              raise SystemExit('media query block not found')
          s = s.replace(old3, new3, 1)
          old4 = '    const plansByProduct = new Map();'
          new4 = '    const categoriesById = new Map((categories || []).map(c => [c.id, c]));\n\n    const plansByProduct = new Map();'
          if old4 not in s:
              raise SystemExit('plans map marker not found')
          s = s.replace(old4, new4, 1)
          old5 = '          ...p,\n          product_plans: productPlans,\n          product_media: productMedia,'
          new5 = '          ...p,\n          product_categories: categoriesById.get(p.category_id) || null,\n          product_plans: productPlans,\n          product_media: productMedia,'
          if old5 not in s:
              raise SystemExit('clean product assembly marker not found')
          s = s.replace(old5, new5, 1)
          p.write_text(s)
          PY
          node --check api/products.js
          git diff --check
          git add api/products.js
          git commit -m "fix: harden products API against category join timeouts"
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/harden-products-api.yml || true
          git commit -m "chore: remove temporary products API workflow" || true
          git push || true
