name: Repair details.js syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair duplicate commas outside strings/comments
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("js/details.js")
          text = path.read_text(encoding="utf-8")

          out = []
          i = 0
          state = "code"
          changed = False

          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ""

              if state == "code":
                  if c == "/" and n == "/":
                      out.extend([c, n])
                      i += 2
                      state = "line_comment"
                      continue
                  if c == "/" and n == "*":
                      out.extend([c, n])
                      i += 2
                      state = "block_comment"
                      continue
                  if c in ("'", '"', "`"):
                      out.append(c)
                      i += 1
                      state = c
                      continue
                  if c == "," and n == ",":
                      out.append(",")
                      i += 2
                      changed = True
                      continue
                  out.append(c)
                  i += 1
                  continue

              if state == "line_comment":
                  out.append(c)
                  i += 1
                  if c == "\n":
                      state = "code"
                  continue

              if state == "block_comment":
                  out.append(c)
                  i += 1
                  if c == "*" and n == "/":
                      out.append(n)
                      i += 1
                      state = "code"
                  continue

              # String/template literal. Preserve escapes exactly.
              out.append(c)
              i += 1
              if c == "\\" and i < len(text):
                  out.append(text[i])
                  i += 1
              elif c == state:
                  state = "code"

          fixed = "".join(out)
          path.write_text(fixed, encoding="utf-8")

          subprocess.run(["node", "--check", str(path)], check=True)
          print("details.js syntax check passed")
          print("Changed:", changed)

      - name: Commit repaired catalog
        shell: bash
        run: |
          if git diff --quiet -- js/details.js; then
            echo "No catalog syntax repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/details.js
          git commit -m "Fix details.js catalog syntax"
          git push origin main

      - name: Remove temporary repair workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/repair-details-js.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/repair-details-js.yml
          git commit -m "Remove temporary details.js repair workflow" || true
          git push origin main || true
