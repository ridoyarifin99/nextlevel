name: Cleanup Details page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Details runtime conflicts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('details.html')
          s = p.read_text(encoding='utf-8')

          # Remove local/dev-only auth configuration and duplicate/obsolete stylesheet/script imports.
          s = re.sub(r'\s*<script>window\.AUTH_API_BASE\s*=\s*[\"\']http://localhost:8080[\"\'];</script>', '', s, count=1)
          s = s.replace('  <link rel="stylesheet" href="./src/input.css">\r\n', '')
          s = s.replace('  <link rel="stylesheet" href="./src/input.css">\n', '')
          # details.html historically loaded auth twice: js/auth.js and src/auth.js.
          s = s.replace('  <script src="./src/auth.js"></script>\r\n', '')
          s = s.replace('  <script src="./src/auth.js"></script>\n', '')

          # Make Reviews a single-owner feature. The dedicated reviews-system-v3.js owns the Reviews tab;
          # remove the legacy inline renderer so it can never repaint the same DOM.
          legacy_reviews = re.compile(
              r"\s*\} else if \(t === 'reviews'\) \{.*?(?=\s*\} else if \(t === 'faq'\) \{)",
              re.S,
          )
          s, n = legacy_reviews.subn('', s, count=1)
          if n != 1:
              raise SystemExit('Could not locate the legacy inline Reviews renderer')

          p.write_text(s.replace('\r\n', '\n'), encoding='utf-8')
          PY

      - name: Clean review runtime retry loop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/reviews-system-v3.js')
          s = p.read_text(encoding='utf-8')
          old = '    setInterval(takeOver,500);'
          new = '''    // The central Details runtime can be loaded before or after this file.\n    // Retry only during startup; never keep a permanent polling loop alive.\n    let attempts = 0;\n    const retry = () => {\n      if (installTabOwner() || attempts++ >= 40) return;\n      setTimeout(retry, 250);\n    };\n    retry();'''
          if old not in s:
              raise SystemExit('Expected review retry loop not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify no legacy Details conflicts remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('details.html').read_text(encoding='utf-8')
          assert 'AUTH_API_BASE = "http://localhost:8080"' not in s
          assert './src/auth.js' not in s
          assert './src/input.css' not in s
          assert "else if (t === 'reviews')" not in s
          r = Path('js/reviews-system-v3.js').read_text(encoding='utf-8')
          assert 'setInterval(takeOver,500)' not in r
          print('Details cleanup verification passed.')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add details.html js/reviews-system-v3.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make Details Reviews single-owner and remove legacy conflicts'
          git push

      - name: Remove cleanup workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/cleanup-details.yml || true
          git commit -m 'chore: remove one-time cleanup workflow' || true
          git push || true
