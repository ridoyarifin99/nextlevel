name: Fix mobile product rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[product-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove delayed product rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''        setTimeout(() => { 
          fSubs=[...subs]; 
          renderCats(); 
          updateCartUI(); 
          if(typeof AOS!=='undefined') setTimeout(()=>AOS.refresh(), 50);
        }, 1500);'''
          new = '''        fSubs=[...subs];
        renderCats();
        updateCartUI();
        if(typeof AOS!=='undefined') requestAnimationFrame(()=>AOS.refresh());'''
          if old not in s:
              raise SystemExit('Expected delayed product-render block was not found; refusing to modify index.html.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-mobile-products.yml
          git add index.html
          git commit -m 'Remove mobile product rendering delay [product-fix]'
          git push
