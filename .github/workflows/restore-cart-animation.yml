name: Restore Cart Animation
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add cart animation loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/supabase-config.js')
          s=p.read_text()
          old="  load('script[data-nextlevel-central-catalog]','/js/central-catalog.js?v=20260912-7','nextlevelCentralCatalog');"
          new=old+"\n  load('script[data-nextlevel-add-to-cart-animation]','/js/add-to-cart-animation.js?v=20260912-1','nextlevelAddToCartAnimation');"
          if "data-nextlevel-add-to-cart-animation" not in s:
              if old not in s: raise SystemExit('central catalog loader not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/supabase-config.js
          git commit -m "fix: restore add to cart animation loader"
          git push
