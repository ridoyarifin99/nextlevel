<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | NEXT LEVEL SUBS</title>
    <link rel="stylesheet" href="/src/output.css">
    <link rel="stylesheet" href="/src/all.min.css">
    <link rel="stylesheet" href="./src/aos.css">
    <script src="./src/aos.js"></script>
    <style>
        :root {
            --primary-color: #6a11cb;
            --primary-dark: #4a0699;
            --primary-light: #9d4edd;
            --secondary-color: #2575fc;
            --transition: all .3s cubic-bezier(.4, 0, .2, 1);
        }
        body { font-family: Inter, sans-serif; background: #f8fafc; }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(to right, var(--primary-color), var(--primary-light));
            color: white; transition: var(--transition); border: none;
            border-radius: 0.5rem; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer;
        }
        .btn-primary:hover { background: linear-gradient(to right, var(--primary-dark), var(--primary-color)); transform: translateY(-2px); }
        
        /* Plan Cards */
        .plan-card {
            transition: var(--transition); cursor: pointer; border: 2px solid #e5e7eb;
            border-radius: 0.75rem; background: white; padding: 1rem; text-align: center; position: relative;
        }
        .plan-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-color: var(--primary-light); }
        .plan-card.selected { border-color: var(--primary-color); background-color: rgba(106, 17, 203, 0.05); }
        .popular-badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #ff4757; color: white; font-size: 0.65rem; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; font-weight: bold; }

        /* Tabs */
        .tab-button {
            transition: var(--transition); position: relative; color: #64748b;
            font-weight: 600; padding: 1rem 0; margin-right: 2rem; background: none; border: none;
        }
        .tab-button.active { color: var(--primary-color); }
        .tab-button.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--primary-color); border-radius: 3px; }

        /* Gallery */
        .gallery-container { border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .gallery-slider { display: flex; transition: transform 0.5s ease-in-out; }
        .gallery-slide { min-width: 100%; aspect-ratio: 16/9; }
        .gallery-slide img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-thumbnail { transition: var(--transition); cursor: pointer; opacity: 0.6; border: 2px solid transparent; }
        .gallery-thumbnail:hover { opacity: 1; }
        .gallery-thumbnail.active { opacity: 1; border-color: var(--primary-color); }

        /* Reviews */
        .review-card { border-bottom: 1px solid #e5e7eb; padding: 1.5rem 0; }
        .star { color: #f59e0b; }
        .review-form { background: #f8f9ff; border: 1px solid #e8eaf0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }

        /* Related Products */
        .subscription-card { transition: var(--transition); background: white; border-radius: 0.75rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .subscription-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(106,17,203,0.15); }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <img src="/images/next_level.png" alt="Logo" class="h-10 w-auto">
            </a>
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-purple-600 hidden sm:block">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Shop
                </a>
                <a href="checkout.html" class="relative p-2 text-gray-700">
                    <i class="fa-solid fa-basket-shopping text-2xl"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <nav class="bg-white border-b border-gray-200 py-3">
        <div class="container mx-auto px-4">
            <ol class="flex items-center space-x-2 text-sm">
                <li><a href="index.html" class="text-gray-500 hover:text-blue-500">Home</a></li>
                <li class="text-gray-400">/</li>
                <li id="breadcrumbProduct" class="text-gray-700 font-medium">Product Details</li>
            </ol>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-8">
        <div class="container mx-auto px-4">
            <div id="productDetails" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Loading Skeleton -->
                <div class="animate-pulse">
                    <div class="bg-gray-300 rounded-xl h-96 w-full mb-4"></div>
                    <div class="flex gap-2">
                        <div class="bg-gray-300 h-20 w-20 rounded-lg"></div>
                        <div class="bg-gray-300 h-20 w-20 rounded-lg"></div>
                    </div>
                </div>
                <div class="animate-pulse">
                    <div class="bg-gray-300 h-8 w-3/4 mb-4 rounded"></div>
                    <div class="bg-gray-300 h-4 w-full mb-2 rounded"></div>
                    <div class="bg-gray-300 h-4 w-5/6 mb-6 rounded"></div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-gray-300 h-24 rounded-lg"></div>
                        <div class="bg-gray-300 h-24 rounded-lg"></div>
                    </div>
                    <div class="bg-gray-300 h-12 w-full rounded-lg"></div>
                </div>
            </div>
            
            <!-- Tabs Section -->
            <div class="mt-12 bg-white rounded-xl shadow-md overflow-hidden">
                <div class="border-b border-gray-200 flex px-6 overflow-x-auto">
                    <button class="tab-button active whitespace-nowrap" onclick="switchTab('description')">Description</button>
                    <button class="tab-button whitespace-nowrap" onclick="switchTab('features')">Features</button>
                    <button class="tab-button whitespace-nowrap" onclick="switchTab('reviews')">Reviews</button>
                    <button class="tab-button whitespace-nowrap" onclick="switchTab('faq')">FAQ</button>
                </div>
                <div class="p-6"><div id="tabContent"></div></div>
            </div>
            
            <!-- Related Products -->
            <div class="mt-12">
                <h2 class="text-2xl font-bold mb-6">Related Subscriptions</h2>
                <div id="relatedProducts" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"></div>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 text-center">
            <i class="fas fa-check text-5xl text-green-500 mb-4"></i>
            <h2 class="text-2xl font-bold mb-2">Added to Cart!</h2>
            <button onclick="document.getElementById('successModal').classList.add('hidden')" class="btn-primary mt-4">Continue Shopping</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase-config.js"></script>
    <!-- Load products from external file to prevent code bloat -->
    <script src="./js/products.js"></script>
    
    <script>
        AOS.init({ duration: 800, once: true });

        let cart = JSON.parse(localStorage.getItem('streamHubCart')) || [];
        let currentProduct = null;
        let selectedPlan = 0;
        let currentUser = null;
        let userExistingReview = null;

        const supabase = window.supabaseClient;

        // Check Auth State
        if (supabase) {
            supabase.auth.getSession().then(({ data }) => {
                currentUser = data.session?.user || null;
            });
            supabase.auth.onAuthStateChange((event, session) => {
                currentUser = session?.user || null;
                if (document.querySelector('.tab-button.active')?.textContent.includes('Reviews')) {
                    initReviewsTab(); 
                }
            });
        }

        window.onload = function() {
            // Ensure products array is loaded from products.js
            if (typeof products === 'undefined' || products.length === 0) {
                document.getElementById('productDetails').innerHTML = '<div class="col-span-2 text-center text-red-500 font-bold">Error: Products array not found. Make sure js/products.js is loaded correctly.</div>';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const productName = decodeURIComponent(urlParams.get('name'));
            
            if (productName) {
                loadProduct(productName);
            } else {
                // If no product name in URL, just load the first product as a fallback so page isn't blank
                loadProduct(products[0].name);
            }
            updateCartCount();
        };

        function loadProduct(name) {
            currentProduct = products.find(p => p.name === name);
            if (!currentProduct) {
                document.getElementById('productDetails').innerHTML = `<div class="col-span-2 text-center text-gray-500">Product not found. <a href="index.html" class="text-purple-600 underline">Go back</a></div>`;
                return;
            }
            
            selectedPlan = currentProduct.pricing.findIndex(p => p.popular);
            if (selectedPlan === -1) selectedPlan = 0;
            
            renderProductDetails();
            loadRelatedProducts();
            switchTab('description');
        }

        function renderProductDetails() {
            document.getElementById('breadcrumbProduct').textContent = currentProduct.name;
            document.getElementById('productDetails').innerHTML = `
                <div data-aos="fade-right">
                    <div class="gallery-container">
                        <div class="gallery-slider" id="gallerySlider">
                            ${currentProduct.images.map(img => `<div class="gallery-slide"><img src="${img}" alt="${currentProduct.name}"></div>`).join('')}
                        </div>
                    </div>
                    <div class="flex gap-2 mt-4 overflow-x-auto pb-2">
                        ${currentProduct.images.map((img, i) => `<img src="${img}" class="gallery-thumbnail w-20 h-20 rounded-lg object-cover" onclick="goToSlide(${i})">`).join('')}
                    </div>
                </div>
                <div data-aos="fade-left">
                    <h1 class="text-3xl font-bold mb-2">${currentProduct.name}</h1>
                    <div class="flex items-center mb-4">
                        <div class="text-yellow-400 mr-2">${'<i class="fas fa-star"></i>'.repeat(Math.round(currentProduct.rating))}</div>
                        <span class="text-gray-600">${currentProduct.rating} Stars</span>
                    </div>
                    <p class="text-gray-600 mb-6">${currentProduct.description}</p>
                    
                    <h3 class="text-lg font-semibold mb-3">Select Subscription Plan:</h3>
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        ${currentProduct.pricing.map((plan, i) => `
                            <div class="plan-card ${i === selectedPlan ? 'selected' : ''}" onclick="selectPlan(${i})">
                                ${plan.popular ? '<span class="popular-badge">Most Popular</span>' : ''}
                                <div class="font-medium mt-2">${plan.duration}</div>
                                <div class="text-2xl font-bold mt-1">${plan.currency} ${plan.price}</div>
                                ${plan.discount ? `<div class="text-xs text-green-500 mt-1">${plan.discount}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-6">
                        ${currentProduct.features.slice(0, 4).map(f => `<div class="flex items-center p-2 bg-gray-50 rounded-lg"><i class="fas fa-check text-green-500 mr-2"></i> ${f}</div>`).join('')}
                    </div>

                    <button onclick="addToCart()" class="btn-primary w-full py-3 rounded-lg font-semibold">
                        <i class="fa-regular fa-cart-circle-plus mr-2"></i>Add to Cart
                    </button>
                </div>
            `;
            // Set first thumbnail as active
            const thumbs = document.querySelectorAll('.gallery-thumbnail');
            if(thumbs.length > 0) thumbs[0].classList.add('active');
        }

        function goToSlide(index) {
            const slider = document.getElementById('gallerySlider');
            if(!slider) return;
            slider.style.transform = `translateX(-${index * 100}%)`;
            document.querySelectorAll('.gallery-thumbnail').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === index);
            });
        }

        function selectPlan(index) {
            selectedPlan = index;
            document.querySelectorAll('.plan-card').forEach((card, i) => {
                card.classList.toggle('selected', i === index);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().includes(tabName));
            });

            const tabContent = document.getElementById('tabContent');
            if (tabName === 'description') {
                tabContent.innerHTML = `
                    <div class="prose max-w-none">
                        <p class="text-gray-700 mb-4">${currentProduct.description}</p>
                        <p class="text-gray-700 mb-4">Experience the best quality service with our premium offerings. Full access to all features without any ads.</p>
                    </div>`;
            } else if (tabName === 'features') {
                tabContent.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${currentProduct.features.map(f => `<div class="flex items-start p-4 bg-gray-50 rounded-lg"><i class="fas fa-check text-green-500 mt-1 mr-3"></i><span>${f}</span></div>`).join('')}</div>`;
            } else if (tabName === 'reviews') {
                tabContent.innerHTML = `<div id="reviewFormContainer"></div><div id="reviewsList" class="mt-6"></div>`;
                initReviewsTab();
            } else if (tabName === 'faq') {
                tabContent.innerHTML = `<div class="space-y-4">${currentProduct.faq.map(item => `<div class="border rounded-lg p-4"><h4 class="font-bold mb-2">${item.question}</h4><p class="text-gray-600">${item.answer}</p></div>`).join('')}</div>`;
            }
            AOS.refresh();
        }

        function loadRelatedProducts() {
            const related = products.filter(p => p.name !== currentProduct.name && p.categories.some(c => currentProduct.categories.includes(c))).slice(0, 5);
            if(related.length === 0) {
                document.getElementById('relatedProducts').innerHTML = '<p class="text-gray-500">No related products found.</p>';
                return;
            }
            document.getElementById('relatedProducts').innerHTML = related.map(p => `
                <a href="details.html?name=${encodeURIComponent(p.name)}" class="subscription-card block">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-32 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-md mb-1">${p.name}</h3>
                        <div class="text-purple-600 font-bold">${p.pricing[0].currency} ${p.pricing[0].price}</div>
                    </div>
                </a>
            `).join('');
        }

        // --- REVIEW SYSTEM LOGIC ---
        async function initReviewsTab() {
            renderReviewFormUI();
            await loadReviews();
        }

        function renderReviewFormUI() {
            const formContainer = document.getElementById('reviewFormContainer');
            if (!currentUser) {
                formContainer.innerHTML = `<div class="bg-blue-50 text-blue-700 p-4 rounded-lg text-center">Please <a href="login.html" class="font-bold underline">log in</a> to leave a review.</div>`;
                return;
            }
            
            formContainer.innerHTML = `
                <div class="review-form">
                    <h4 class="font-bold text-lg mb-3">${userExistingReview ? 'Edit Your Review' : 'Write a Review'}</h4>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">Your Rating</label>
                        <select id="ratingInput" class="w-full p-2 border rounded">
                            <option value="5" ${userExistingReview?.rating == 5 ? 'selected' : ''}>5 Stars</option>
                            <option value="4" ${userExistingReview?.rating == 4 ? 'selected' : ''}>4 Stars</option>
                            <option value="3" ${userExistingReview?.rating == 3 ? 'selected' : ''}>3 Stars</option>
                            <option value="2" ${userExistingReview?.rating == 2 ? 'selected' : ''}>2 Stars</option>
                            <option value="1" ${userExistingReview?.rating == 1 ? 'selected' : ''}>1 Star</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm font-medium mb-1">Your Review</label>
                        <textarea id="reviewTextInput" class="w-full p-2 border rounded" rows="3" placeholder="Share your experience...">${userExistingReview?.review_text || ''}</textarea>
                    </div>
                    <button onclick="submitReview()" class="btn-primary">${userExistingReview ? 'Update Review' : 'Submit Review'}</button>
                </div>
            `;
        }

        async function loadReviews() {
            const list = document.getElementById('reviewsList');
            list.innerHTML = '<p class="text-gray-500">Loading reviews...</p>';

            const { data: reviews, error } = await supabase
                .from('product_reviews')
                .select('*')
                .eq('product_slug', currentProduct.name)
                .order('created_at', { ascending: false });

            if (error) return list.innerHTML = '<p class="text-red-500">Error loading reviews.</p>';

            userExistingReview = currentUser ? reviews.find(r => r.user_id === currentUser.id) : null;
            renderReviewFormUI(); 

            if (!reviews || reviews.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-8">No reviews yet. Be the first to review!</p>';
                return;
            }

            list.innerHTML = reviews.map(r => `
                <div class="review-card">
                    <div class="flex justify-between items-center mb-2">
                        <div>
                            <h4 class="font-bold">${r.author_name}</h4>
                            <div class="star">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                        </div>
                        <span class="text-sm text-gray-500">${new Date(r.created_at).toLocaleDateString()}</span>
                    </div>
                    <p class="text-gray-600">${r.review_text}</p>
                </div>
            `).join('');
        }

        async function submitReview() {
            if (!currentUser) return alert('Please log in to submit a review.');
            
            const rating = document.getElementById('ratingInput').value;
            const text = document.getElementById('reviewTextInput').value.trim();
            if (!text) return alert('Please write something in your review.');

            const payload = {
                product_slug: currentProduct.name,
                user_id: currentUser.id,
                author_name: currentUser.user_metadata?.full_name || currentUser.email,
                rating: parseInt(rating),
                review_text: text
            };

            if (userExistingReview) {
                const { error } = await supabase.from('product_reviews').update(payload).eq('id', userExistingReview.id);
                if (error) return alert('Error updating review.');
                alert('Review updated successfully!');
            } else {
                const { error } = await supabase.from('product_reviews').insert(payload);
                if (error) return alert('Error submitting review.');
                alert('Review submitted successfully!');
            }
            await loadReviews();
        }

        // --- CART LOGIC ---
        function addToCart() {
            const item = { ...currentProduct, selectedPlan: currentProduct.pricing[selectedPlan], quantity: 1 };
            const idx = cart.findIndex(c => c.name === currentProduct.name);
            if (idx !== -1) cart[idx] = item; else cart.push(item);
            localStorage.setItem('streamHubCart', JSON.stringify(cart));
            updateCartCount();
            document.getElementById('successModal').classList.remove('hidden');
        }

        function updateCartCount() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
        }
    </script>
</body>
</html>
