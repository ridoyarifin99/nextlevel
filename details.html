nt:center;background:linear-gradient(135deg,rgba(106,17,203,.1),rgba(37,117,252,.1))}.product-image{width:100%;height:100%;object-fit:cover}.product-icon{font-size:24px;color:var(--primary-color)}.subscription-card{transition:var(--transition);cursor:pointer;height:100%;display:flex;flex-direction:column;border-radius:.75rem;overflow:hidden;box-shadow:var(--shadow);background:#fff}.subscription-card:hover{transform:translateY(-8px);box-shadow:0 15px 30px rgba(106,17,203,.15)}.logo-container{display:flex;align-items:center;position:relative}.logo-image{height:40px;width:auto;margin-right:10px}.logo-text{font-size:1.5rem;font-weight:bold;background:linear-gradient(to right,var(--primary-color),var(--secondary-color));-webkit-background-clip:text;-webkit-text-fill-color:transparent;transition:var(--transition)}.category-header{display:flex;align-items:center;margin-bottom:1.5rem}.category-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:1rem}.category-title{font-size:1.75rem;font-weight:bold;background:linear-gradient(to right,var(--primary-color),var(--secondary-color));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.category-description{color:var(--text-light);margin-top:.25rem}.cart-badge{transition:var(--transition)}.cart-badge.pulse{animation:pulse .5s ease-in-out}.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background-color:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}.loading-overlay.active{opacity:1;visibility:visible}@media(max-width:768px){.gallery-slide{aspect-ratio:4/3}.whatsapp-fab{bottom:100px;right:30px}.gallery-nav{width:30px;height:30px}.gallery-prev{left:5px}.gallery-next{right:5px}}@media(max-width:480px){.popular-badge{font-size:.65rem;padding:.2rem .5rem}}

<script>
AOS.init({duration:800,once:true,offset:100});
function goHomeParent(){window.parent&&window.parent!==window?window.parent.postMessage({type:'NLS_GO_HOME'},'*'):window.location.href='/'}
function goToProductParent(n){window.parent&&window.parent!==window?window.parent.postMessage({type:'NLS_NAVIGATE_PRODUCT',productName:n},'*'):window.location.href='/details.html?name='+encodeURIComponent(n)}
let cart=JSON.parse(localStorage.getItem('streamHubCart'))||[],currentProduct=null,selectedPlan=2,currentSlide=0;
const $=id=>document.getElementById(id),loadingOverlay=$('loadingOverlay'),productDetails=$('productDetails'),breadcrumbProduct=$('breadcrumbProduct'),tabContent=$('tabContent'),relatedProducts=$('relatedProducts'),cartCount=$('cartCount'),successModal=$('successModal'),fab=$('fab'),whatsappFab=$('whatsappFab');
function init(){showSkeletonLoaders();const p=new URLSearchParams(location.search).get('name');loadCart();setTimeout(()=>{if(p)loadProduct(decodeURIComponent(p));else location.href='index.html';loadingOverlay.classList.remove('active')},1500);window.addEventListener('scroll',()=>{const s=window.pageYOffset>300;fab.style.opacity=s?'1':'0';fab.style.visibility=s?'visible':'hidden';whatsappFab.style.opacity=s?'1':'0';whatsappFab.style.visibility=s?'visible':'hidden'})}
function showSkeletonLoaders(){loadingOverlay.classList.add('active');productDetails.innerHTML=`<div class="animate-slide-in-left" data-aos="fade-right"><div class="skeleton-card"><div class="skeleton skeleton-image" style="aspect-ratio:16/9"></div></div><div class="flex mt-4 space-x-2 overflow-x-auto pb-2">${[1,2,3].map(()=>'<div class="skeleton w-20 h-20 rounded-lg"></div>').join('')}</div></div><div class="animate-slide-in-right" data-aos="fade-left"><div class="skeleton-card p-6" style="height:500px"><div class="flex items-center mb-4"><div class="skeleton skeleton-image mr-4"></div><div class="flex-1"><div class="skeleton skeleton-title mb-2"></div><div class="skeleton skeleton-text w-32"></div></div></div><div class="skeleton skeleton-text mb-6"></div><div class="skeleton skeleton-title mb-3"></div><div class="grid grid-cols-2 gap-3 mb-6">${[1,2,3,4].map(()=>'<div class="skeleton-card p-4"><div class="skeleton skeleton-title mb-2"></div><div class="skeleton skeleton-price"></div></div>').join('')}</div><div class="skeleton skeleton-title mb-3"></div>${[1,2,3,4].map(()=>'<div class="flex items-center mb-2"><div class="skeleton w-4 h-4 rounded-full mr-2"></div><div class="skeleton skeleton-text flex-1"></div></div>').join('')}</div><div class="flex space-x-4 mt-6"><div class="skeleton skeleton-button flex-1"></div><div class="skeleton skeleton-button flex-1"></div></div></div></div>`;relatedProducts.innerHTML='';for(let i=0;i<5;i++){const c=document.createElement('div');c.className='skeleton-card';c.innerHTML='<div class="p-6"><div class="flex items-center mb-4"><div class="skeleton skeleton-image mr-3"></div><div class="flex-1"><div class="skeleton skeleton-title mb-1"></div><div class="skeleton skeleton-text w-32"></div></div></div><div class="flex justify-between items-center mb-4"><div class="skeleton skeleton-price"></div><div class="skeleton skeleton-text w-8"></div></div><div class="skeleton skeleton-button"></div></div>';relatedProducts.appendChild(c)}}
function loadCart(){const s=localStorage.getItem('streamHubCart');if(s)cart=JSON.parse(s);updateCartCount()}
function saveCart(){localStorage.setItem('streamHubCart',JSON.stringify(cart))}
function loadProduct(n){const i=products.findIndex(p=>p.name===n);if(i===-1){location.href='index.html';return}currentProduct=JSON.parse(JSON.stringify(products[i]));if(!currentProduct.customerReviews||!Array.isArray(currentProduct.customerReviews))currentProduct.customerReviews=[];if(!currentProduct.faq||!Array.isArray(currentProduct.faq))currentProduct.faq=[];breadcrumbProduct.textContent=currentProduct.name;currentSlide=0;renderProductDetails();switchTab('description');loadRelatedProducts();setTimeout(()=>AOS.refresh(),100)}
function renderProductDetails(){productDetails.innerHTML=`<div class="animate-slide-in-left" data-aos="fade-right"><div class="gallery-container"><div class="gallery-slider" id="gallerySlider">${currentProduct.images.map((i,x)=>`<div class="gallery-slide"><img src="${i}" alt="${currentProduct.name} ${x+1}"><div class="absolute top-4 right-4 bg-white rounded-full p-2 shadow-md cursor-pointer" onclick="toggleFavorite()"><i id="favoriteIcon" class="far fa-heart text-xl"></i></div></div>`).join('')}</div><div class="gallery-nav gallery-prev" onclick="prevSlide()"><i class="fas fa-chevron-left"></i></div><div class="gallery-nav gallery-next" onclick="nextSlide()"><i class="fas fa-chevron-right"></i></div></div><div class="gallery-dots">${currentProduct.images.map((_,x)=>`<div class="gallery-dot ${x===0?'active':''}" onclick="goToSlide(${x})"></div>`).join('')}</div><div class="flex mt-4 space-x-2 overflow-x-auto pb-2">${currentProduct.images.map((i,x)=>`<img src="${i}" alt="${currentProduct.name} ${x+1}" class="gallery-thumbnail w-20 h-20 rounded-lg object-cover flex-shrink-0 cursor-pointer ${x===0?'active':''}" onclick="goToSlide(${x})">`).join('')}</div></div><div class="animate-slide-in-right" data-aos="fade-left"><div class="flex items-center mb-4"><img src="${currentProduct.image}" alt="${currentProduct.name}" class="w-16 h-16 rounded-lg mr-4 object-contain"><div><h1 class="text-3xl font-bold">${currentProduct.name}</h1><div class="flex items-center mt-1"><div class="flex text-yellow-400">${generateStars(currentProduct.rating)}</div><span class="ml-2 text-gray-600">${currentProduct.rating} (${currentProduct.reviews.toLocaleString()} reviews)</span></div></div></div><p class="text-gray-600 mb-6">${currentProduct.description}</p><div class="mb-6"><h3 class="text-lg font-semibold mb-3">Select Subscription Plan:</h3><div class="grid grid-cols-2 gap-3">${currentProduct.pricing.map((p,i)=>`<div class="plan-card p-4 rounded-lg border border-gray-200 text-center ${p.popular?'relative':''} ${i===selectedPlan?'selected':''}" onclick="selectPlan(${i})">${p.popular?'<span class="popular-badge">Most Popular</span>':''}<div class="font-medium mt-3">${p.duration}</div><div class="text-2xl font-bold mt-1">${p.currency} ${p.price}</div>${p.discount?`<div class="text-xs text-green-500 mt-1">${p.discount}</div>`:''}</div>`).join('')}</div></div><div class="mb-6"><h3 class="text-lg font-semibold mb-3">Key Features:</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${currentProduct.features.map((f,i)=>`<div class="feature-item flex items-center p-2 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors" style="animation-delay:${i*.1}s" data-aos="fade-up" data-aos-delay="${i*100}"><i class="fas fa-check-circle text-green-500 mr-2"></i><span class="text-gray-700">${f}</span></div>`).join('')}</div></div><div class="flex space-x-4"><button onclick="addToCart()" class="flex-1 py-3 rounded-lg font-semibold text-white btn-primary"><i class="fa-regular fa-cart-circle-plus mr-2"></i>Add to Cart</button><button onclick="buyNow()" class="flex-1 py-3 rounded-lg font-semibold text-white btn-whatsapp"><i class="fab fa-whatsapp mr-2"></i>Buy Now</button></div><div class="mt-6 pt-6 border-t border-gray-200"><div class="flex flex-wrap items-center justify-between text-sm text-gray-600 gap-2"><div class="flex items-center"><i class="fas fa-shield-alt mr-2"></i><span>30-Day Money Back Guarantee</span></div><div class="flex items-center"><i class="fas fa-lock mr-2"></i><span>Secure Payment</span></div><div class="flex items-center"><i class="fas fa-headset mr-2"></i><span>24/7 Support</span></div></div></div></div>`;setTimeout(()=>{document.querySelectorAll('.feature-item').forEach((item,i)=>setTimeout(()=>item.classList.add('show'),i*100))},500)}
function updateGallery(){const s=$('gallerySlider'),d=document.querySelectorAll('.gallery-dot'),t=document.querySelectorAll('.gallery-thumbnail');s.style.transform=`translateX(-${currentSlide*100}%)`;d.forEach((dot,i)=>dot.classList.toggle('active',i===currentSlide));t.forEach((thumb,i)=>thumb.classList.toggle('active',i===currentSlide))}
function nextSlide(){currentSlide=(currentSlide+1)%currentProduct.images.length;updateGallery()}
function prevSlide(){currentSlide=(currentSlide-1+currentProduct.images.length)%currentProduct.images.length;updateGallery()}
function goToSlide(i){currentSlide=i;updateGallery()}
function generateStars(r){const f=Math.floor(r),h=r%1!==0;let s='';for(let i=0;i<f;i++)s+='<i class="fas fa-star"></i>';if(h)s+='<i class="fas fa-star-half-alt"></i>';const e=5-Math.ceil(r);for(let i=0;i<e;i++)s+='<i class="far fa-star"></i>';return s}
function toggleFavorite(){const i=$('favoriteIcon');if(i.classList.contains('far')){i.classList.remove('far');i.classList.add('fas','text-red-500')}else{i.classList.remove('fas','text-red-500');i.classList.add('far')}}
function selectPlan(i){selectedPlan=i;document.querySelectorAll('.plan-card').forEach((c,x)=>c.classList.toggle('selected',x===i))}
function switchTab(t){document.querySelectorAll('.tab-button').forEach(b=>{b.classList.remove('active');if(b.textContent.toLowerCase().includes(t))b.classList.add('active')});try{switch(t){case'description':tabContent.innerHTML=`<div class="prose max-w-none"><p class="text-gray-700 mb-4">${currentProduct.description}</p><h3 class="text-xl font-semibold mb-3">Why Choose ${currentProduct.name}?</h3><p class="text-gray-700 mb-4">${currentProduct.name} offers an unparalleled experience with a vast library of content. From premium features to exclusive benefits, there's something for everyone.</p><p class="text-gray-700 mb-4">With our subscription, you get unlimited access to all features without any ads or interruptions. Experience the best quality service with our premium offerings.</p><h3 class="text-xl font-semibold mb-3">What's Included?</h3><ul class="list-disc list-inside text-gray-700 space-y-2"><li>Full access to all features</li><li>Premium quality service</li><li>Download for offline use (where applicable)</li><li>Multiple device access</li><li>Personalized experience</li><li>24/7 customer support</li></ul></div>`;break;case'features':tabContent.innerHTML=`<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${currentProduct.features.map((f,i)=>`<div class="flex items-start p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors" data-aos="fade-up" data-aos-delay="${i*100}"><i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i><span class="text-gray-700">${f}</span></div>`).join('')}</div>`;break;case'reviews':let r='';if(currentProduct.customerReviews.length)r=`<div class="space-y-4">${currentProduct.customerReviews.map((v,i)=>`<div class="border-b border-gray-200 pb-4" data-aos="fade-up" data-aos-delay="${i*100}"><div class="flex items-center justify-between mb-2"><div class="flex items-center"><div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center mr-3"><span class="font-semibold text-gray-700">${v.name.charAt(0)}</span></div><div><h4 class="font-medium">${v.name}</h4><div class="flex text-yellow-400 text-sm">${generateStars(v.rating)}</div></div></div><span class="text-sm text-gray-500">${formatDate(v.date)}</span></div><p class="text-gray-700">${v.comment}</p></div>`).join('')}</div>`;else r=`<div class="text-center py-8"><i class="fas fa-comments text-4xl text-gray-300 mb-4"></i><p class="text-gray-600">No reviews yet. Be the first to review this product!</p></div>`;tabContent.innerHTML=`<div class="space-y-6"><div class="flex items-center justify-between"><div><h3 class="text-xl font-semibold">Customer Reviews</h3><div class="flex items-center mt-1"><div class="flex text-yellow-400 text-xl">${generateStars(currentProduct.rating)}</div><span class="ml-2 text-gray-600">${currentProduct.rating} out of 5</span></div></div><button class="btn-primary px-4 py-2 rounded-lg">Write a Review</button></div>${r}</div>`;break;case'faq':let f='';if(currentProduct.faq.length)f=`${currentProduct.faq.map((v,i)=>`<div class="border border-gray-200 rounded-lg" data-aos="fade-up" data-aos-delay="${i*100}"><button class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-50 transition-colors" onclick="toggleFAQ(this)"><span class="font-medium">${v.question}</span><i class="fas fa-chevron-down transition-transform"></i></button><div class="hidden px-4 pb-3 text-gray-700">${v.answer}</div></div>`).join('')}`;else f=`<div class="text-center py-8"><i class="fas fa-question-circle text-4xl text-gray-300 mb-4"></i><p class="text-gray-600">No FAQs available for this product.</p></div>`;tabContent.innerHTML=`<div class="space-y-4">${f}</div>`;break}setTimeout(()=>AOS.refresh(),100)}catch(e){console.error(e);tabContent.innerHTML='<p class="text-gray-600">Error loading content.</p>'}}
function formatDate(d){const t=new Date(d),n=new Date(),a=Math.abs(n-t),c=Math.ceil(a/864e5);if(c===1)return'1 day ago';if(c<7)return`${c} days ago`;if(c<30)return`${Math.floor(c/7)} weeks ago`;if(c<365)return`${Math.floor(c/30)} months ago`;return`${Math.floor(c/365)} years ago`}
function toggleFAQ(b){const c=b.nextElementSibling,i=b.querySelector('i');if(c.classList.contains('hidden')){c.classList.remove('hidden');i.style.transform='rotate(180deg)'}else{c.classList.add('hidden');i.style.transform='rotate(0)'}}
function loadRelatedProducts(){let r=currentProduct.categories||[];let rel=products.filter(p=>p.name!==currentProduct.name&&p.categories.some(c=>r.includes(c))).slice(0,5);if(rel.length<5){let add=products.filter(p=>p.name!==currentProduct.name&&!rel.includes(p)).slice(0,5-rel.length);rel.push(...add)}relatedProducts.innerHTML=rel.map((p,i)=>{const s=p.name.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");return `<div class="subscription-card bg-white rounded-xl shadow-md overflow-hidden transition-transform duration-300 hover:shadow-lg hover:-translate-y-1" data-aos="fade-up" data-aos-delay="${i*100}"><a href="/product/${s}" class="card-link" onclick="event.preventDefault();goToProductParent('${p.name.replace(/'/g,"\\'")}');"><div class="product-image-container"><img src="${p.image}" alt="${p.name}" class="product-image"></div><div class="p-4 sm:p-5 md:p-6"><div class="mb-4"><h3 class="font-bold text-lg">${p.name}</h3><p class="text-sm text-gray-500">${p.description}</p></div><div class="flex justify-between items-center mb-4"><div><span class="text-2xl font-bold">BDT ${p.pricing[2].price}</span><span class="text-gray-500">/${p.pricing[2].duration}</span></div><div class="flex items-center"><i class="fas fa-star text-yellow-400"></i><span class="ml-1 text-gray-600">${p.rating}</span></div></div><button class="w-full py-2 rounded-lg font-medium text-white btn-primary">View Details</button></div></a></div>`}).join('')}
function addToCart(){const p=currentProduct.pricing[selectedPlan],i={...currentProduct,selectedPlan:p,quantity:1},e=cart.findIndex(x=>x.name===currentProduct.name);if(e!==-1)cart[e]=i;else cart.push(i);saveCart();updateCartCount();successModal.classList.remove('hidden')}
function buyNow(){const p=currentProduct.pricing[selectedPlan],i={...currentProduct,selectedPlan:p,quantity:1},e=cart.findIndex(x=>x.name===currentProduct.name);if(e!==-1)cart[e]=i;else cart.push(i);saveCart();updateCartCount();location.href='checkout.html'}
function sendToWhatsApp(){const p=currentProduct.pricing[selectedPlan],m=`Hello! I'm interested in purchasing the following subscription:\n\n*Product:* ${currentProduct.name}\n*Plan:* ${p.duration}\n*Price:* ${p.currency} ${p.price}\n${p.discount?`*Discount:* ${p.discount}\n`:''}\nPlease provide me with the payment details and activation instructions.\n\nThank you!`;window.open(`https://wa.me/8801644490566?text=${encodeURIComponent(m)}`,'_blank')}
function updateCartCount(){const t=cart.reduce((s,i)=>s+i.quantity,0);cartCount.textContent=t;cartCount.classList.add('pulse');setTimeout(()=>cartCount.classList.remove('pulse'),500)}
function closeSuccessModal(){successModal.classList.add('hidden')}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}
init();
</script>
</body>
</html>
