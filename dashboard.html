<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Account - Next Level Subs</title>

    <meta
        name="description"
        content="Manage your Next Level Subs account, orders and subscriptions."
    >

    <link
        rel="stylesheet"
        href="./src/output.css"
    >

    <link
        rel="stylesheet"
        href="./src/all.min.css"
    >


    <style>

        body {
            background: #f8fafc;
        }


        .dashboard-card {
            animation: fadeIn .35s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .status-active {
            background: #dcfce7;
            color: #15803d;
        }


        .status-pending {
            background: #fef3c7;
            color: #b45309;
        }


        .status-expired {
            background: #fee2e2;
            color: #b91c1c;
        }


        .status-paid {
            background: #dcfce7;
            color: #15803d;
        }


        .status-processing {
            background: #dbeafe;
            color: #1d4ed8;
        }


        .status-cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }


        .mobile-menu {
            display: none;
        }


        @media (max-width: 768px) {

            .desktop-nav {
                display: none;
            }

            .mobile-menu {
                display: block;
            }

        }


        .spinner-dark {

            width: 30px;
            height: 30px;

            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;

            border-radius: 50%;

            animation: spin .8s linear infinite;

            margin: auto;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        .empty-state {
            padding: 40px 20px;
            text-align: center;
        }


        .order-row {

            transition:
                background-color .2s ease;

        }


        .order-row:hover {

            background-color: #f8fafc;

        }

    </style>

</head>


<body>


<!-- ============================================================
     HEADER
     ============================================================ -->

<header
    class="bg-white shadow-md sticky top-0 z-50"
>

    <div
        class="container mx-auto px-4 py-3"
    >

        <div
            class="flex items-center justify-between"
        >


            <!-- LOGO -->

            <a
                href="index.html"
                class="flex items-center space-x-2"
            >

                <img
                    src="/images/next_level.png"
                    alt="Next Level Subs Logo"
                    class="logo-image"
                >


                <div class="logo-text-container">

                    <div
                        class="logo-text-item"
                        style="
                            color: var(--primary-color);
                            font-size: 1rem;
                        "
                    >
                        Trusted
                    </div>


                    <div
                        class="logo-text-item"
                        style="
                            color: var(--primary-color);
                            font-size: 1rem;
                        "
                    >
                        Cheap
                    </div>


                    <div
                        class="logo-text-item"
                        style="
                            color: var(--primary-color);
                            font-size: 1rem;
                        "
                    >
                        Secure
                    </div>


                    <div
                        class="logo-text-item"
                        style="
                            color: var(--primary-color);
                            font-size: 1rem;
                        "
                    >
                        24/7 Support
                    </div>

                </div>

            </a>


            <!-- DESKTOP NAV -->

            <div
                class="desktop-nav flex items-center space-x-5"
            >

                <a
                    href="index.html"
                    class="text-gray-600 hover:text-blue-500"
                >
                    <i class="fas fa-home mr-1"></i>
                    Home
                </a>


                <a
                    href="checkout.html"
                    class="text-gray-600 hover:text-blue-500"
                >
                    <i class="fas fa-shopping-cart mr-1"></i>
                    Cart
                </a>


                <button
                    id="logoutButton"
                    class="text-red-500 hover:text-red-600"
                >
                    <i class="fas fa-right-from-bracket mr-1"></i>
                    Logout
                </button>

            </div>


            <!-- MOBILE MENU -->

            <div class="mobile-menu">

                <button
                    id="mobileLogoutButton"
                    class="text-red-500"
                >
                    <i class="fas fa-right-from-bracket"></i>
                </button>

            </div>

        </div>

    </div>

</header>



<!-- ============================================================
     MAIN
     ============================================================ -->

<main
    class="container mx-auto px-4 py-10"
>


    <!-- ========================================================
         LOADING
         ======================================================== -->

    <div
        id="loadingState"
        class="py-20 text-center"
    >

        <div class="spinner-dark mb-4"></div>

        <p class="text-gray-500">
            Loading your account...
        </p>

    </div>



    <!-- ========================================================
         DASHBOARD
         ======================================================== -->

    <div
        id="dashboardContent"
        class="hidden"
    >


        <!-- ====================================================
             WELCOME
             ==================================================== -->

        <div
            class="dashboard-card mb-8"
        >

            <div
                class="bg-white rounded-2xl shadow-md p-6"
            >

                <div
                    class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
                >


                    <div>

                        <p
                            class="text-sm text-gray-500 mb-1"
                        >
                            Welcome back,
                        </p>


                        <h1
                            id="customerName"
                            class="text-3xl font-bold text-gray-900"
                        >
                            Customer
                        </h1>


                        <p
                            id="customerEmail"
                            class="text-gray-500 mt-1"
                        >
                            -
                        </p>

                    </div>


                    <a
                        href="index.html"
                        class="inline-flex items-center justify-center px-5 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-semibold transition"
                    >

                        <i
                            class="fas fa-shopping-bag mr-2"
                        ></i>

                        Browse Subscriptions

                    </a>

                </div>

            </div>

        </div>



        <!-- ====================================================
             STATISTICS
             ==================================================== -->

        <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-8"
        >


            <!-- Active subscriptions -->

            <div
                class="dashboard-card bg-white rounded-xl shadow-md p-5"
            >

                <div
                    class="flex items-center justify-between"
                >

                    <div>

                        <p
                            class="text-sm text-gray-500"
                        >
                            Active Subscriptions
                        </p>


                        <p
                            id="activeSubscriptionCount"
                            class="text-3xl font-bold text-gray-900 mt-1"
                        >
                            0
                        </p>

                    </div>


                    <div
                        class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center"
                    >

                        <i
                            class="fas fa-tv text-green-500 text-xl"
                        ></i>

                    </div>

                </div>

            </div>


            <!-- Total orders -->

            <div
                class="dashboard-card bg-white rounded-xl shadow-md p-5"
            >

                <div
                    class="flex items-center justify-between"
                >

                    <div>

                        <p
                            class="text-sm text-gray-500"
                        >
                            Total Orders
                        </p>


                        <p
                            id="totalOrderCount"
                            class="text-3xl font-bold text-gray-900 mt-1"
                        >
                            0
                        </p>

                    </div>


                    <div
                        class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center"
                    >

                        <i
                            class="fas fa-receipt text-blue-500 text-xl"
                        ></i>

                    </div>

                </div>

            </div>


            <!-- Pending -->

            <div
                class="dashboard-card bg-white rounded-xl shadow-md p-5"
            >

                <div
                    class="flex items-center justify-between"
                >

                    <div>

                        <p
                            class="text-sm text-gray-500"
                        >
                            Pending Orders
                        </p>


                        <p
                            id="pendingOrderCount"
                            class="text-3xl font-bold text-gray-900 mt-1"
                        >
                            0
                        </p>

                    </div>


                    <div
                        class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center"
                    >

                        <i
                            class="fas fa-clock text-yellow-500 text-xl"
                        ></i>

                    </div>

                </div>

            </div>

        </div>



        <!-- ====================================================
             ACTIVE SUBSCRIPTIONS
             ==================================================== -->

        <section
            class="dashboard-card mb-8"
        >

            <div
                class="bg-white rounded-2xl shadow-md overflow-hidden"
            >

                <div
                    class="p-6 border-b border-gray-200"
                >

                    <div
                        class="flex items-center justify-between"
                    >

                        <h2
                            class="text-xl font-bold text-gray-900"
                        >
                            My Subscriptions
                        </h2>


                        <i
                            class="fas fa-tv text-blue-500"
                        ></i>

                    </div>

                </div>


                <div
                    id="subscriptionsContainer"
                >

                    <!-- Loaded by JavaScript -->

                </div>

            </div>

        </section>



        <!-- ====================================================
             ORDER HISTORY
             ==================================================== -->

        <section
            class="dashboard-card"
        >

            <div
                class="bg-white rounded-2xl shadow-md overflow-hidden"
            >

                <div
                    class="p-6 border-b border-gray-200"
                >

                    <div
                        class="flex items-center justify-between"
                    >

                        <h2
                            class="text-xl font-bold text-gray-900"
                        >
                            Order History
                        </h2>


                        <i
                            class="fas fa-receipt text-blue-500"
                        ></i>

                    </div>

                </div>


                <div
                    id="ordersContainer"
                >

                    <!-- Loaded by JavaScript -->

                </div>

            </div>

        </section>


    </div>


</main>



<!-- ============================================================
     SUPABASE
     ============================================================ -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="./js/supabase-config.js"
></script>



<!-- ============================================================
     DASHBOARD LOGIC
     ============================================================ -->

<script>

"use strict";


// ============================================================
// DOM
// ============================================================

const loadingState =
    document.getElementById("loadingState");

const dashboardContent =
    document.getElementById("dashboardContent");

const customerName =
    document.getElementById("customerName");

const customerEmail =
    document.getElementById("customerEmail");

const activeSubscriptionCount =
    document.getElementById(
        "activeSubscriptionCount"
    );

const totalOrderCount =
    document.getElementById(
        "totalOrderCount"
    );

const pendingOrderCount =
    document.getElementById(
        "pendingOrderCount"
    );

const subscriptionsContainer =
    document.getElementById(
        "subscriptionsContainer"
    );

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


// ============================================================
// FORMAT DATE
// ============================================================

function formatDate(dateString) {

    if (!dateString) {
        return "—";
    }


    const date =
        new Date(dateString);


    return date.toLocaleDateString(
        "en-GB",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


// ============================================================
// FORMAT CURRENCY
// ============================================================

function formatCurrency(amount) {

    const number =
        Number(amount || 0);


    return "৳" +
        number.toLocaleString(
            "en-BD",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


// ============================================================
// STATUS CLASS
// ============================================================

function getStatusClass(status) {

    const normalized =
        String(status || "")
            .toLowerCase();


    if (
        normalized === "active" ||
        normalized === "paid"
    ) {

        return "status-active";

    }


    if (
        normalized === "pending" ||
        normalized === "processing"
    ) {

        return "status-pending";

    }


    if (
        normalized === "expired" ||
        normalized === "cancelled" ||
        normalized === "failed"
    ) {

        return "status-expired";

    }


    return "bg-gray-100 text-gray-600";

}


// ============================================================
// LOAD PROFILE
// ============================================================

async function loadProfile(user) {

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();


    if (error) {

        console.error(
            "Profile error:",
            error
        );

        throw error;

    }


    customerName.textContent =
        data?.full_name ||
        "Customer";


    customerEmail.textContent =
        data?.email ||
        user.email ||
        "";

}


// ============================================================
// LOAD SUBSCRIPTIONS
// ============================================================

async function loadSubscriptions(user) {

    const {
        data,
        error
    } = await supabaseClient
        .from("subscriptions")
        .select("*")
        .eq("user_id", user.id)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Subscription error:",
            error
        );

        throw error;

    }


    const subscriptions =
        data || [];


    const active =
        subscriptions.filter(
            subscription =>
                subscription.status === "active"
        );


    activeSubscriptionCount.textContent =
        active.length;


    if (subscriptions.length === 0) {

        subscriptionsContainer.innerHTML = `

            <div class="empty-state">

                <div
                    class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4"
                >

                    <i
                        class="fas fa-tv text-gray-400 text-2xl"
                    ></i>

                </div>

                <h3
                    class="font-semibold text-gray-800"
                >
                    No subscriptions yet
                </h3>

                <p
                    class="text-sm text-gray-500 mt-1"
                >
                    Your active subscriptions will appear here.
                </p>

            </div>

        `;

        return;

    }


    subscriptionsContainer.innerHTML =
        subscriptions.map(
            subscription => `

                <div
                    class="p-6 border-b border-gray-100 last:border-b-0"
                >

                    <div
                        class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
                    >

                        <div>

                            <div
                                class="flex items-center gap-3"
                            >

                                <h3
                                    class="font-semibold text-lg text-gray-900"
                                >
                                    ${escapeHTML(
                                        subscription.product_name
                                    )}
                                </h3>

                                <span
                                    class="px-2.5 py-1 rounded-full text-xs font-semibold ${getStatusClass(subscription.status)}"
                                >
                                    ${escapeHTML(
                                        subscription.status
                                    )}
                                </span>

                            </div>


                            <div
                                class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-2 mt-3 text-sm text-gray-500"
                            >

                                <span>

                                    <i class="fas fa-calendar-plus mr-1"></i>

                                    Start:
                                    ${formatDate(
                                        subscription.start_date
                                    )}

                                </span>


                                <span>

                                    <i class="fas fa-calendar-xmark mr-1"></i>

                                    Expires:
                                    ${formatDate(
                                        subscription.expiry_date
                                    )}

                                </span>

                            </div>

                        </div>


                        <div
                            class="text-left md:text-right"
                        >

                            <p
                                class="text-xs text-gray-400"
                            >
                                Subscription ID
                            </p>

                            <p
                                class="text-xs font-mono text-gray-500 mt-1"
                            >
                                ${escapeHTML(
                                    subscription.id
                                        .substring(0, 8)
                                )}
                            </p>

                        </div>

                    </div>

                </div>

            `
        ).join("");

}


// ============================================================
// LOAD ORDERS
// ============================================================

async function loadOrders(user) {

    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .eq("user_id", user.id)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Orders error:",
            error
        );

        throw error;

    }


    const orders =
        data || [];


    totalOrderCount.textContent =
        orders.length;


    const pending =
        orders.filter(
            order =>
                order.payment_status === "pending" ||
                order.order_status === "pending"
        );


    pendingOrderCount.textContent =
        pending.length;


    if (orders.length === 0) {

        ordersContainer.innerHTML = `

            <div class="empty-state">

                <div
                    class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4"
                >

                    <i
                        class="fas fa-receipt text-gray-400 text-2xl"
                    ></i>

                </div>

                <h3
                    class="font-semibold text-gray-800"
                >
                    No orders yet
                </h3>

                <p
                    class="text-sm text-gray-500 mt-1"
                >
                    Your orders will appear here.
                </p>

                <a
                    href="index.html"
                    class="inline-block mt-4 px-5 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-semibold"
                >
                    Browse Products
                </a>

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML = `

        <div class="overflow-x-auto">

            <table class="w-full">

                <thead class="bg-gray-50">

                    <tr>

                        <th
                            class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase"
                        >
                            Order
                        </th>

                        <th
                            class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase"
                        >
                            Date
                        </th>

                        <th
                            class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase"
                        >
                            Total
                        </th>

                        <th
                            class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase"
                        >
                            Payment
                        </th>

                        <th
                            class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase"
                        >
                            Status
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${orders.map(
                        order => `

                            <tr
                                class="order-row border-t border-gray-100"
                            >

                                <td
                                    class="px-6 py-4"
                                >

                                    <p
                                        class="font-semibold text-gray-900"
                                    >
                                        ${escapeHTML(
                                            order.order_number
                                        )}
                                    </p>

                                </td>


                                <td
                                    class="px-6 py-4 text-sm text-gray-500"
                                >

                                    ${formatDate(
                                        order.created_at
                                    )}

                                </td>


                                <td
                                    class="px-6 py-4 font-semibold text-gray-900"
                                >

                                    ${formatCurrency(
                                        order.total
                                    )}

                                </td>


                                <td
                                    class="px-6 py-4"
                                >

                                    <span
                                        class="text-sm capitalize text-gray-600"
                                    >

                                        ${escapeHTML(
                                            order.payment_method
                                                .replace(
                                                    "sslcommerz",
                                                    "SSLCommerz"
                                                )
                                        )}

                                    </span>

                                </td>


                                <td
                                    class="px-6 py-4"
                                >

                                    <span
                                        class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${getStatusClass(order.payment_status)}"
                                    >

                                        ${escapeHTML(
                                            order.payment_status
                                        )}

                                    </span>

                                </td>

                            </tr>

                        `
                    ).join("")}

                </tbody>

            </table>

        </div>

    `;

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(value) {

    if (value === null || value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ============================================================
// LOAD DASHBOARD
// ============================================================

async function loadDashboard() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();


        if (error) {

            throw error;

        }


        const user =
            data?.user;


        // ------------------------------------------------------
        // NOT LOGGED IN
        // ------------------------------------------------------

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        // ------------------------------------------------------
        // LOAD EVERYTHING
        // ------------------------------------------------------

        await loadProfile(user);

        await loadSubscriptions(user);

        await loadOrders(user);


        // ------------------------------------------------------
        // SHOW DASHBOARD
        // ------------------------------------------------------

        loadingState.classList.add("hidden");

        dashboardContent.classList.remove("hidden");

    }
    catch(error) {

        console.error(
            "Dashboard error:",
            error
        );


        loadingState.innerHTML = `

            <div class="text-center">

                <div
                    class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"
                >

                    <i
                        class="fas fa-triangle-exclamation text-red-500 text-2xl"
                    ></i>

                </div>

                <h2
                    class="text-xl font-bold text-gray-800"
                >
                    Unable to load account
                </h2>

                <p
                    class="text-gray-500 mt-2"
                >
                    Please log in again.
                </p>

                <a
                    href="login.html"
                    class="inline-block mt-5 px-5 py-2 bg-blue-500 text-white rounded-lg font-semibold"
                >
                    Login
                </a>

            </div>

        `;

    }

}


// ============================================================
// LOGOUT
// ============================================================

async function logout() {

    try {

        const {
            error
        } = await supabaseClient.auth.signOut();


        if (error) {

            throw error;

        }


        window.location.href =
            "login.html";

    }
    catch(error) {

        console.error(
            "Logout error:",
            error
        );

        alert(
            "Unable to logout. Please try again."
        );

    }

}


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


document
    .getElementById("mobileLogoutButton")
    .addEventListener(
        "click",
        logout
    );


// ============================================================
// START
// ============================================================

loadDashboard();

</script>

</body>
</html>
