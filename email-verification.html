<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | Next Level Subs</title>
    <style>
        *{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;background:#f4f4f9}.card{background:#fff;padding:35px 30px;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.1);text-align:center;max-width:430px;width:100%}.spinner{width:36px;height:36px;margin:0 auto 20px;border:4px solid #e5e5e5;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h2{margin:0 0 12px;color:#222;font-size:24px}p{margin:0;color:#666;line-height:1.5}.success{color:#16803c}.error{color:#d93025}
    </style>
</head>
<body>
    <div class="card">
        <div id="spinner" class="spinner"></div>
        <h2 id="status-message">Verifying your email...</h2>
        <p id="status-description">Please wait a moment.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script>
        "use strict";
        const messageEl = document.getElementById("status-message"),
              descriptionEl = document.getElementById("status-description"),
              spinnerEl = document.getElementById("spinner"),
              WEBSITE_URL = "https://www.nextlevelsubs.com/";

        function cleanAuthUrl() {
            try {
                if (window.location.hash && (window.location.hash.includes("access_token") || window.location.hash.includes("type"))) {
                    window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
                }
            } catch (e) {
                console.warn("Could not clean URL:", e);
            }
        }

        function showSuccess() {
            spinnerEl.style.display = "none";
            messageEl.textContent = "Email verified successfully!";
            messageEl.classList.add("success");
            descriptionEl.textContent = "Redirecting to Next Level Subs...";
        }

        function showError(msg = "Verification failed or link expired.") {
            spinnerEl.style.display = "none";
            messageEl.textContent = msg;
            messageEl.classList.add("error");
            descriptionEl.textContent = "Please request a new verification email and try again.";
        }

        async function verifyEmail() {
            if (!window.supabaseClient) {
                showError("Unable to connect to authentication service.");
                return;
            }

            window.supabaseClient.auth.onAuthStateChange((event, session) => {
                if ((event === "SIGNED_IN" || event === "USER_UPDATED") && session?.user) {
                    showSuccess();
                    cleanAuthUrl();
                    setTimeout(() => window.location.replace(WEBSITE_URL), 1200);
                }
            });

            const { data } = await window.supabaseClient.auth.getSession();
            if (data?.session?.user) {
                showSuccess();
                cleanAuthUrl();
                setTimeout(() => window.location.replace(WEBSITE_URL), 1200);
                return;
            }

            setTimeout(async () => {
                const { data: retryData } = await window.supabaseClient.auth.getSession();
                if (retryData?.session?.user) {
                    showSuccess();
                    cleanAuthUrl();
                    setTimeout(() => window.location.replace(WEBSITE_URL), 1200);
                } else {
                    showError();
                }
            }, 1500);
        }

        verifyEmail();
    </script>
</body>
</html>
